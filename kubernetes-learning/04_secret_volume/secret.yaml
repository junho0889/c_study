# =============================================================================
# Kubernetes 학습 04단계: Secret (비밀 정보 관리)
# =============================================================================
# Secret은 비밀번호, API 키, 인증서 같은 민감한 정보를 저장하는 곳입니다.
# ConfigMap과 비슷하지만, 비밀 정보 전용으로 만들어졌습니다.
#
# 비유: ConfigMap이 "공개 게시판"이라면,
#       Secret은 "금고"입니다. 열쇠가 있어야 내용을 볼 수 있습니다.
#
# 중요: 기본적으로 Secret은 Base64 인코딩만 됩니다 (암호화가 아닙니다!)
#       운영 환경에서는 etcd 암호화를 반드시 설정하세요.
# =============================================================================

---
# ─────────────────────────────────────────────
# 1. Opaque Secret (일반 비밀 정보)
# ─────────────────────────────────────────────
# 가장 흔한 Secret 유형입니다.
# DB 비밀번호, API 키 등을 저장합니다.
# 비유: 서랍장에 열쇠를 넣어 두는 것
apiVersion: v1
kind: Secret
metadata:
  name: lesson-db-secret
  labels:
    app: lesson-web
# type: Opaque는 "일반 용도"라는 뜻입니다. (기본값)
# 다른 유형: kubernetes.io/tls, kubernetes.io/dockerconfigjson 등
type: Opaque

# data: Base64로 인코딩된 값을 넣습니다.
# 터미널에서 인코딩하는 방법: echo -n 'my-password' | base64
# 디코딩하는 방법:           echo 'bXktcGFzc3dvcmQ=' | base64 -d
#
# 주의: Base64는 "암호화"가 아니라 "인코딩"입니다!
# 비유: 글씨를 뒤집어 적는 것일 뿐, 누구나 다시 뒤집어 읽을 수 있습니다.
data:
  # echo -n 'student' | base64 → c3R1ZGVudA==
  DB_USER: c3R1ZGVudA==
  # echo -n 'super-secret-pw' | base64 → c3VwZXItc2VjcmV0LXB3
  DB_PASSWORD: c3VwZXItc2VjcmV0LXB3

# stringData를 쓰면 Base64 인코딩 없이 평문으로 적을 수 있습니다.
# Kubernetes가 자동으로 Base64 인코딩을 합니다.
# 학습이나 개발 시 편리합니다.
# stringData:
#   DB_USER: student
#   DB_PASSWORD: super-secret-pw

---
# ─────────────────────────────────────────────
# 2. TLS Secret (SSL/TLS 인증서)
# ─────────────────────────────────────────────
# HTTPS에 사용하는 인증서와 개인 키를 저장합니다.
# 비유: 신분증(인증서)과 도장(개인 키)을 함께 보관하는 것
#
# 실제 인증서 생성 방법 (테스트용):
#   openssl req -x509 -nodes -days 365 \
#     -newkey rsa:2048 \
#     -keyout tls.key -out tls.crt \
#     -subj "/CN=lesson.example.com"
#
# 그 후 kubectl로 생성:
#   kubectl create secret tls lesson-tls-secret \
#     --cert=tls.crt --key=tls.key
apiVersion: v1
kind: Secret
metadata:
  name: lesson-tls-secret
type: kubernetes.io/tls
data:
  # 실제로는 인증서와 키의 Base64 인코딩 값을 넣습니다.
  # 아래는 예시 placeholder입니다.
  tls.crt: LS0tLS1CRUdJTi...   # Base64 인코딩된 인증서
  tls.key: LS0tLS1CRUdJTi...   # Base64 인코딩된 개인 키

---
# ─────────────────────────────────────────────
# 3. Secret을 사용하는 Pod
# ─────────────────────────────────────────────
apiVersion: v1
kind: Pod
metadata:
  name: lesson-secret-pod
  labels:
    app: lesson-web
spec:
  containers:
    - name: lesson-app
      image: python:3.12-slim
      command: ["sh", "-c", "echo DB_USER=$DB_USER && echo 'Secret mounted!' && cat /etc/secrets/DB_PASSWORD && sleep 3600"]

      # ┌──────────────────────────────────────────┐
      # │  방법 1: 환경 변수로 Secret 주입           │
      # └──────────────────────────────────────────┘
      # Secret의 값을 환경 변수로 컨테이너에 전달합니다.
      # 비유: 금고에서 열쇠를 꺼내 주머니에 넣는 것
      #
      # 주의: 환경 변수는 docker inspect나 프로세스 목록에서 보일 수 있습니다.
      # 더 안전한 방법은 볼륨 마운트(방법 2)입니다.
      env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: lesson-db-secret   # Secret 이름
              key: DB_USER             # Secret 안의 키

      # ┌──────────────────────────────────────────┐
      # │  방법 2: 볼륨으로 Secret 마운트            │
      # └──────────────────────────────────────────┘
      # Secret을 파일로 컨테이너 안에 마운트합니다.
      # 비유: 금고를 통째로 방 안에 가져다 놓는 것
      #       (파일을 열어야 내용을 볼 수 있음)
      #
      # 장점: 환경 변수보다 안전하고, Secret이 업데이트되면 자동 반영됩니다.
      volumeMounts:
        - name: secret-volume
          mountPath: /etc/secrets     # 이 경로에 Secret 파일이 생깁니다
          readOnly: true              # 읽기 전용으로 마운트

  volumes:
    - name: secret-volume
      secret:
        secretName: lesson-db-secret
        # 파일 권한 설정 (8진수)
        # 0400 = 소유자만 읽기 가능 (보안 강화)
        defaultMode: 0400

# =============================================================================
# 사용 방법:
#   kubectl apply -f secret.yaml
#   kubectl get secrets
#   kubectl describe secret lesson-db-secret
#
# Secret 값 확인 (디코딩):
#   kubectl get secret lesson-db-secret -o jsonpath='{.data.DB_USER}' | base64 -d
#
# Pod에서 확인:
#   kubectl exec lesson-secret-pod -- env | grep DB_
#   kubectl exec lesson-secret-pod -- cat /etc/secrets/DB_PASSWORD
#
# 명령줄로 Secret 생성:
#   kubectl create secret generic my-secret \
#     --from-literal=username=admin \
#     --from-literal=password=my-pw
#
# 파일에서 Secret 생성:
#   kubectl create secret generic my-secret \
#     --from-file=./username.txt \
#     --from-file=./password.txt
# =============================================================================
