# =============================================================================
# Kubernetes 학습 09단계: ServiceAccount (서비스 계정)
# =============================================================================
# ServiceAccount는 Pod가 Kubernetes API와 통신할 때 사용하는 "신분증"입니다.
#
# 비유:
#   - 사람이 학교에 들어갈 때 학생증이 필요하듯이,
#     Pod가 Kubernetes API에 접근할 때 ServiceAccount가 필요합니다.
#   - 학생증에 따라 갈 수 있는 곳이 다릅니다:
#     학생 → 교실만 / 선생님 → 교무실도 가능 / 교장 → 전체 접근
#
# 모든 네임스페이스에는 "default" ServiceAccount가 자동 생성됩니다.
# 하지만 보안을 위해 전용 ServiceAccount를 만들어 사용하는 것이 좋습니다.
# =============================================================================

---
# ─────────────────────────────────────────────
# 1. ServiceAccount 생성 (개발자용)
# ─────────────────────────────────────────────
# 비유: "개발팀 전용 학생증 발급"
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lesson-dev-sa
  namespace: lesson-rbac
  labels:
    team: development
  annotations:
    # 주석으로 설명을 달 수 있습니다.
    description: "개발팀이 사용하는 서비스 계정입니다."

# ┌──────────────────────────────────────────────────────────┐
# │  automountServiceAccountToken: 자동 마운트 설정           │
# └──────────────────────────────────────────────────────────┘
# true (기본값) : Pod에 자동으로 토큰이 마운트됩니다.
# false         : API 접근이 필요 없는 Pod에서는 끄는 것이 안전합니다.
#
# 비유: "학생증을 항상 목에 걸고 다닐지, 필요할 때만 꺼낼지"
# 보안 팁: API에 접근할 필요가 없는 Pod는 false로 설정하세요.
automountServiceAccountToken: true

---
# ─────────────────────────────────────────────
# 2. ServiceAccount 생성 (조회 전용)
# ─────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lesson-viewer-sa
  namespace: lesson-rbac
  labels:
    team: operations
automountServiceAccountToken: true

---
# ─────────────────────────────────────────────
# 3. ServiceAccount 생성 (최소 권한)
# ─────────────────────────────────────────────
# API 접근이 필요 없는 일반 앱용 ServiceAccount입니다.
# 비유: "급식실만 이용하는 학생은 다른 시설 출입증이 필요 없다"
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lesson-minimal-sa
  namespace: lesson-rbac
  labels:
    team: general
# 토큰 자동 마운트를 끕니다 → API 접근 차단
automountServiceAccountToken: false

---
# ─────────────────────────────────────────────
# 4. ServiceAccount를 사용하는 Pod
# ─────────────────────────────────────────────
apiVersion: v1
kind: Pod
metadata:
  name: lesson-dev-pod
  namespace: lesson-rbac
  labels:
    app: lesson-dev
spec:
  # ┌──────────────────────────────────────────┐
  # │  serviceAccountName: 사용할 SA 지정       │
  # └──────────────────────────────────────────┘
  # 이 Pod는 lesson-dev-sa의 권한으로 API에 접근합니다.
  # 비유: "이 학생은 개발팀 학생증을 사용합니다"
  serviceAccountName: lesson-dev-sa

  containers:
    - name: app
      image: python:3.12-slim
      command:
        - python
        - -c
        - |
          import os
          # ServiceAccount 토큰은 이 경로에 자동 마운트됩니다.
          token_path = "/var/run/secrets/kubernetes.io/serviceaccount/token"
          ca_path = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          ns_path = "/var/run/secrets/kubernetes.io/serviceaccount/namespace"

          if os.path.exists(token_path):
              print("ServiceAccount 토큰이 마운트되어 있습니다!")
              with open(ns_path) as f:
                  print(f"  네임스페이스: {f.read()}")
              print(f"  토큰 경로: {token_path}")
              print(f"  CA 인증서 경로: {ca_path}")
          else:
              print("토큰이 마운트되어 있지 않습니다.")

          import time
          time.sleep(3600)

---
# ─────────────────────────────────────────────
# 5. 최소 권한 Pod (API 접근 차단)
# ─────────────────────────────────────────────
apiVersion: v1
kind: Pod
metadata:
  name: lesson-minimal-pod
  namespace: lesson-rbac
  labels:
    app: lesson-minimal
spec:
  serviceAccountName: lesson-minimal-sa
  # Pod 레벨에서도 토큰 마운트를 끌 수 있습니다.
  automountServiceAccountToken: false

  containers:
    - name: app
      image: nginx:1.27-alpine
      # 이 Pod는 Kubernetes API에 접근할 수 없습니다.
      # 단순한 웹 서버를 실행하는 것이므로 API 접근이 필요 없습니다.
      ports:
        - containerPort: 80

# =============================================================================
# 사용 방법:
#   kubectl apply -f serviceaccount.yaml
#   kubectl get serviceaccount -n lesson-rbac
#   kubectl describe serviceaccount lesson-dev-sa -n lesson-rbac
#
# Pod에서 SA 토큰 확인:
#   kubectl exec lesson-dev-pod -n lesson-rbac -- \
#     cat /var/run/secrets/kubernetes.io/serviceaccount/token
#
# SA로 API 호출 테스트:
#   kubectl exec lesson-dev-pod -n lesson-rbac -- \
#     curl -s --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
#     -H "Authorization: Bearer $(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" \
#     https://kubernetes.default.svc/api/v1/namespaces/lesson-rbac/pods
#
# 보안 체크리스트:
#   1. default ServiceAccount를 사용하지 말 것 (전용 SA 생성)
#   2. API 접근 불필요 시 automountServiceAccountToken: false
#   3. 최소 권한 원칙 적용 (RBAC으로 필요한 권한만 부여)
#   4. 정기적으로 사용하지 않는 SA 정리
# =============================================================================
