# =============================================================================
# Kubernetes 학습 05단계: Ingress (외부 트래픽 라우팅)
# =============================================================================
# Service는 클러스터 안에서 통신하는 방법이고,
# Ingress는 클러스터 바깥에서 안으로 들어오는 HTTP 트래픽을 관리합니다.
#
# 비유: Service가 "건물 안 복도"라면,
#       Ingress는 "건물 정문 안내 데스크"입니다.
#       안내 데스크에서 "어느 층(서비스)으로 가실 건가요?"라고 안내합니다.
#
# 전제 조건: Ingress Controller가 클러스터에 설치되어 있어야 합니다.
#   예: nginx-ingress, traefik, AWS ALB Ingress Controller 등
#   설치: kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.9.4/deploy/static/provider/cloud/deploy.yaml
# =============================================================================

---
# ─────────────────────────────────────────────
# 1. Path 기반 라우팅 (경로별 분배)
# ─────────────────────────────────────────────
# URL 경로에 따라 다른 서비스로 보내는 방식입니다.
# 비유: 백화점 안내판
#   - /shop    → 1층 매장 (shop-service)
#   - /api     → 2층 사무실 (api-service)
#   - /admin   → 3층 관리실 (admin-service)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lesson-path-ingress
  annotations:
    # Ingress Controller 종류에 따라 다른 annotation을 사용합니다.
    # nginx Ingress Controller용 설정입니다.
    nginx.ingress.kubernetes.io/rewrite-target: /
    # SSL 리다이렉트: HTTP로 접속하면 HTTPS로 자동 전환
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  # ingressClassName: 어떤 Ingress Controller를 사용할지
  # 클러스터에 여러 Controller가 있을 때 구분합니다.
  ingressClassName: nginx

  # ┌──────────────────────────────────────────┐
  # │  TLS 설정: HTTPS 암호화                   │
  # └──────────────────────────────────────────┘
  # 비유: 건물 정문에 자물쇠(SSL 인증서)를 다는 것
  #       방문자와 건물 사이의 대화가 암호화됩니다.
  tls:
    - hosts:
        - lesson.example.com
      # Secret에 저장된 TLS 인증서를 참조합니다.
      # kubectl create secret tls lesson-tls --cert=tls.crt --key=tls.key
      secretName: lesson-tls-secret

  rules:
    # ┌──────────────────────────────────────────┐
    # │  Host 기반 라우팅: 도메인별 분배           │
    # └──────────────────────────────────────────┘
    # 어떤 도메인으로 접속했느냐에 따라 다른 규칙을 적용합니다.
    # 비유: 같은 건물이지만 "A회사 입구", "B회사 입구"가 따로 있는 것
    - host: lesson.example.com
      http:
        paths:
          # ┌──────────────────────────────────────┐
          # │  pathType 종류:                       │
          # │  Prefix       : 경로 접두사 매칭      │
          # │  Exact        : 정확히 일치할 때만     │
          # │  ImplementationSpecific: 컨트롤러 결정│
          # └──────────────────────────────────────┘

          # /shop 으로 시작하는 모든 요청 → shop-service로
          - path: /shop
            pathType: Prefix
            backend:
              service:
                name: shop-service
                port:
                  number: 80

          # /api 로 시작하는 모든 요청 → api-service로
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 8080

          # 위의 경로에 해당하지 않는 모든 요청 → default-service로
          - path: /
            pathType: Prefix
            backend:
              service:
                name: default-service
                port:
                  number: 80

---
# ─────────────────────────────────────────────
# 2. Host 기반 라우팅 (도메인별 분배)
# ─────────────────────────────────────────────
# 접속 도메인에 따라 다른 서비스로 보내는 방식입니다.
# 비유: 같은 건물에 여러 회사가 입주해 있는 것
#   - shop.example.com  → 쇼핑몰 서비스
#   - blog.example.com  → 블로그 서비스
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lesson-host-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: shop.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shop-service
                port:
                  number: 80

    - host: blog.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: blog-service
                port:
                  number: 80

---
# ─────────────────────────────────────────────
# 3. 테스트용 서비스와 Deployment (예시)
# ─────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shop
  template:
    metadata:
      labels:
        app: shop
    spec:
      containers:
        - name: shop
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: shop-service
spec:
  selector:
    app: shop
  ports:
    - port: 80
      targetPort: 80

# =============================================================================
# 사용 방법:
#   kubectl apply -f ingress.yaml
#   kubectl get ingress
#   kubectl describe ingress lesson-path-ingress
#
# 로컬 테스트 (hosts 파일 수정):
#   # /etc/hosts (Linux/Mac) 또는 C:\Windows\System32\drivers\etc\hosts
#   127.0.0.1 lesson.example.com
#   127.0.0.1 shop.example.com
#   127.0.0.1 blog.example.com
#
# Ingress Controller 설치 확인:
#   kubectl get pods -n ingress-nginx
#
# 트래픽 흐름:
#   사용자 → Ingress Controller → Ingress 규칙 → Service → Pod
# =============================================================================
