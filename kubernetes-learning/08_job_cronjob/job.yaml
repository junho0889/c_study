# =============================================================================
# Kubernetes 학습 08단계: Job (일회성 작업)
# =============================================================================
# Deployment/StatefulSet은 "계속 실행되는" 서비스를 위한 것입니다.
# Job은 "한 번 실행하고 끝나는" 작업을 위한 것입니다.
#
# 비유:
#   Deployment = 매일 출근하는 정규직 (계속 실행)
#   Job        = 한 번만 오는 수리기사 (작업 완료 후 퇴근)
#
# 사용 예시:
#   - 데이터베이스 마이그레이션
#   - 일괄 데이터 처리 (batch processing)
#   - 파일 변환, 이메일 발송
#   - 머신러닝 학습 작업
# =============================================================================

---
# ─────────────────────────────────────────────
# 1. 기본 Job (한 번 실행)
# ─────────────────────────────────────────────
apiVersion: batch/v1
kind: Job
metadata:
  name: lesson-basic-job
spec:
  template:
    metadata:
      labels:
        app: lesson-job
    spec:
      containers:
        - name: worker
          image: python:3.12-slim
          command:
            - python
            - -c
            - |
              import time
              print("작업을 시작합니다...")
              for i in range(1, 6):
                  print(f"  처리 중... {i}/5")
                  time.sleep(2)
              print("작업이 완료되었습니다!")

      # ┌──────────────────────────────────────────┐
      # │  restartPolicy: 재시작 정책               │
      # └──────────────────────────────────────────┘
      # Job에서는 "Always"를 쓸 수 없습니다!
      # - Never     : 실패해도 같은 Pod를 재시작하지 않음 (새 Pod 생성)
      # - OnFailure : 실패 시 같은 Pod 안에서 컨테이너 재시작
      #
      # 비유:
      #   Never     : 수리기사가 실패하면 다른 수리기사를 보냄
      #   OnFailure : 같은 수리기사가 다시 시도
      restartPolicy: Never

  # ┌──────────────────────────────────────────┐
  # │  backoffLimit: 실패 시 재시도 횟수        │
  # └──────────────────────────────────────────┘
  # Job이 실패했을 때 최대 몇 번까지 다시 시도할지 정합니다.
  # 비유: "수리기사를 최대 4번까지 다시 보낸다"
  # 기본값은 6입니다.
  backoffLimit: 4

  # ┌──────────────────────────────────────────┐
  # │  activeDeadlineSeconds: 최대 실행 시간     │
  # └──────────────────────────────────────────┘
  # 작업이 이 시간을 넘으면 강제로 중단됩니다.
  # 비유: "수리가 1시간(3600초) 안에 끝나지 않으면 중단"
  activeDeadlineSeconds: 3600

  # ┌──────────────────────────────────────────┐
  # │  ttlSecondsAfterFinished: 완료 후 정리    │
  # └──────────────────────────────────────────┘
  # 작업 완료 후 이 시간이 지나면 Job과 Pod를 자동 삭제합니다.
  # 비유: "수리 완료 후 100초 뒤에 수리 기록을 정리"
  # 설정하지 않으면 완료된 Job이 계속 남아 있습니다.
  ttlSecondsAfterFinished: 100

---
# ─────────────────────────────────────────────
# 2. 병렬 Job (여러 Pod가 동시에 작업)
# ─────────────────────────────────────────────
# 큰 작업을 여러 Pod가 나눠서 처리합니다.
# 비유: 이사할 때 짐을 혼자 나르는 대신 친구 3명이 함께 나르기
apiVersion: batch/v1
kind: Job
metadata:
  name: lesson-parallel-job
spec:
  # completions: 총 몇 번의 성공이 필요한지
  # 비유: "총 5상자의 짐을 날라야 한다"
  completions: 5

  # parallelism: 동시에 몇 개의 Pod를 실행할지
  # 비유: "한 번에 3명이 동시에 짐을 나른다"
  parallelism: 3

  # completionMode:
  #   NonIndexed (기본값): Pod들이 동일한 작업 수행
  #   Indexed: 각 Pod에 인덱스(0,1,2...)가 부여되어 다른 작업 가능
  completionMode: Indexed

  template:
    metadata:
      labels:
        app: lesson-parallel-job
    spec:
      containers:
        - name: worker
          image: python:3.12-slim
          command:
            - python
            - -c
            - |
              import os, time
              index = os.environ.get("JOB_COMPLETION_INDEX", "?")
              print(f"Worker #{index} 시작!")
              time.sleep(5)
              print(f"Worker #{index} 완료!")
      restartPolicy: Never

  backoffLimit: 3

# =============================================================================
# 사용 방법:
#   kubectl apply -f job.yaml
#   kubectl get jobs
#   kubectl get pods -l app=lesson-job    ← Job이 만든 Pod 확인
#   kubectl logs job/lesson-basic-job     ← Job 로그 확인
#
# Job 상태:
#   kubectl describe job lesson-basic-job
#   → Completions: 1/1     ← 1개 중 1개 완료
#   → Pods Statuses: 0 Active / 1 Succeeded / 0 Failed
#
# 완료된 Pod 확인:
#   kubectl get pods --field-selector=status.phase=Succeeded
#
# Job 삭제 (Pod도 함께 삭제됨):
#   kubectl delete job lesson-basic-job
# =============================================================================
