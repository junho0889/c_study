# =============================================================================
# Kubernetes 학습 07단계: StatefulSet (상태가 있는 애플리케이션)
# =============================================================================
# Deployment는 모든 Pod가 "동일한 일회용 직원"입니다.
# 하지만 DB처럼 각 Pod가 "고유한 정체성"을 가져야 할 때가 있습니다.
#
# StatefulSet은 각 Pod에 고유한 이름과 저장소를 부여합니다.
#
# 비유:
#   Deployment = 편의점 알바생 (누가 와도 같은 일을 합니다)
#   StatefulSet = 병원 의사 (김 의사, 이 의사 → 각자 담당 환자가 있음)
#
# StatefulSet의 특징:
#   1. 순서 보장: Pod가 0, 1, 2 순서대로 생성되고 역순으로 삭제됩니다.
#   2. 고유 이름: web-0, web-1, web-2 처럼 번호가 붙습니다.
#   3. 고유 저장소: 각 Pod마다 전용 PVC가 생깁니다.
#   4. 안정적 네트워크 ID: Pod를 재시작해도 같은 DNS 이름을 유지합니다.
# =============================================================================

---
# ─────────────────────────────────────────────
# 1. Headless Service (StatefulSet 필수!)
# ─────────────────────────────────────────────
# StatefulSet은 반드시 Headless Service가 필요합니다.
# 일반 Service는 하나의 IP로 트래픽을 분산하지만,
# Headless Service는 각 Pod의 개별 IP를 직접 알려줍니다.
#
# 비유:
#   일반 Service = 대표 전화번호 (누가 받을지 모름)
#   Headless Service = 내선 번호부 (김 의사: 101, 이 의사: 102)
#
# DNS 형식: <pod-name>.<service-name>.<namespace>.svc.cluster.local
#   예: db-0.lesson-db-headless.default.svc.cluster.local
apiVersion: v1
kind: Service
metadata:
  name: lesson-db-headless
  labels:
    app: lesson-db
spec:
  ports:
    - port: 5432
      name: postgres
  # clusterIP: None ← 이것이 Headless Service의 핵심입니다!
  # IP를 할당하지 않고, DNS로만 각 Pod에 접근합니다.
  clusterIP: None
  selector:
    app: lesson-db

---
# ─────────────────────────────────────────────
# 2. StatefulSet
# ─────────────────────────────────────────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: lesson-db
spec:
  # serviceName: 연결할 Headless Service 이름 (필수!)
  serviceName: lesson-db-headless

  replicas: 3    # db-0, db-1, db-2 세 개의 Pod 생성

  selector:
    matchLabels:
      app: lesson-db

  template:
    metadata:
      labels:
        app: lesson-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: lesson_db
            - name: POSTGRES_USER
              value: student
            - name: POSTGRES_PASSWORD
              value: study1234
            # PGDATA를 PVC 마운트 경로 안의 하위 폴더로 설정합니다.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

          # 각 Pod마다 고유한 PVC가 마운트됩니다.
          volumeMounts:
            - name: db-storage
              mountPath: /var/lib/postgresql/data

  # ┌──────────────────────────────────────────────────────────┐
  # │  volumeClaimTemplates: 각 Pod마다 전용 PVC 자동 생성     │
  # └──────────────────────────────────────────────────────────┘
  # Deployment에서는 모든 Pod가 같은 PVC를 공유합니다.
  # StatefulSet에서는 Pod마다 독립적인 PVC가 자동으로 만들어집니다.
  #
  # 비유: Deployment는 공용 사물함, StatefulSet은 개인 사물함
  #   db-0 → db-storage-lesson-db-0 (전용 PVC)
  #   db-1 → db-storage-lesson-db-1 (전용 PVC)
  #   db-2 → db-storage-lesson-db-2 (전용 PVC)
  #
  # Pod를 삭제해도 PVC는 남아 있어서 데이터가 보존됩니다!
  volumeClaimTemplates:
    - metadata:
        name: db-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi

  # ┌──────────────────────────────────────────┐
  # │  podManagementPolicy: 생성/삭제 순서       │
  # └──────────────────────────────────────────┘
  # OrderedReady (기본값): 0→1→2 순서대로 생성, 2→1→0 역순으로 삭제
  #   비유: 1번 환자부터 차례대로 진료
  # Parallel: 동시에 생성/삭제 (순서 불필요시)
  #   비유: 모든 환자를 동시에 진료
  podManagementPolicy: OrderedReady

  # updateStrategy: 업데이트 전략
  # RollingUpdate (기본값): 역순(2→1→0)으로 하나씩 업데이트
  # OnDelete: 수동으로 Pod를 삭제해야 새 버전이 생성됨
  updateStrategy:
    type: RollingUpdate

# =============================================================================
# 사용 방법:
#   kubectl apply -f statefulset.yaml
#   kubectl get statefulset
#   kubectl get pods -l app=lesson-db     ← db-0, db-1, db-2 확인
#   kubectl get pvc                       ← 각 Pod 전용 PVC 확인
#
# 개별 Pod DNS 접근:
#   kubectl run -i --tty dns-test --rm --image=busybox -- sh
#   > nslookup lesson-db-headless
#   > nslookup db-0.lesson-db-headless
#   > nslookup db-1.lesson-db-headless
#
# 순서 확인:
#   kubectl delete pod db-2   ← db-2만 삭제되고 자동 재생성
#   kubectl scale statefulset lesson-db --replicas=1  ← db-2, db-1 순서로 삭제
#
# PVC 정리 (StatefulSet 삭제 후 수동으로!):
#   kubectl delete statefulset lesson-db
#   kubectl delete pvc db-storage-lesson-db-0
#   kubectl delete pvc db-storage-lesson-db-1
#   kubectl delete pvc db-storage-lesson-db-2
# =============================================================================
