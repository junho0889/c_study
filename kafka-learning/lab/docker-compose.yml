##############################################################################
# ■■■ Kafka Docker Compose 실습 환경 ■■■
#
# 구성 요소:
#   - Zookeeper: Kafka 클러스터 메타데이터 관리 (브로커 등록, 토픽 정보 등)
#   - Kafka Broker x3: 메시지 브로커 3대 (고가용성 + 파티션 리플리케이션)
#   - Kafka UI: 웹 기반 Kafka 모니터링/관리 도구
#
# 실행 방법:
#   docker-compose up -d
#
# 종료 방법:
#   docker-compose down          # 컨테이너만 삭제
#   docker-compose down -v       # 컨테이너 + 볼륨(데이터) 삭제
##############################################################################

# Docker Compose 파일 버전 (3.8은 Docker Engine 19.03+ 지원)
version: "3.8"

# ■■■ 서비스 정의 ■■■
services:

  ##########################################################################
  # ■■■ Zookeeper ■■■
  # Kafka 클러스터의 코디네이터 역할
  # - 브로커 등록/해제 감지
  # - 토픽/파티션 메타데이터 저장
  # - 컨트롤러 선출 (Controller Election)
  # 참고: Kafka 3.5+ 에서는 KRaft 모드로 Zookeeper 없이 운영 가능
  ##########################################################################
  zookeeper:
    # Confluent 공식 Zookeeper 이미지 사용
    image: confluentinc/cp-zookeeper:${CONFLUENT_VERSION:-7.6.0}
    container_name: zookeeper
    hostname: zookeeper
    # 컨테이너 비정상 종료 시 자동 재시작
    restart: unless-stopped
    ports:
      # Zookeeper 클라이언트 포트 (Kafka 브로커가 연결하는 포트)
      - "${ZK_CLIENT_PORT:-2181}:2181"
    environment:
      # Zookeeper 클라이언트 연결 포트
      ZOOKEEPER_CLIENT_PORT: 2181
      # Zookeeper 내부 틱 타임 (밀리초) - 하트비트 간격의 기본 단위
      ZOOKEEPER_TICK_TIME: ${ZK_TICK_TIME:-2000}
      # 초기 동기화 허용 틱 수 (TICK_TIME * INIT_LIMIT = 최대 초기화 시간)
      ZOOKEEPER_INIT_LIMIT: 5
      # 팔로워-리더 동기화 허용 틱 수
      ZOOKEEPER_SYNC_LIMIT: 2
      # JVM 힙 메모리 설정 (실습 환경이므로 작게 설정)
      KAFKA_HEAP_OPTS: "-Xmx${ZK_HEAP_SIZE:-256M} -Xms${ZK_HEAP_SIZE:-256M}"
    volumes:
      # Zookeeper 데이터 영속화 (컨테이너 재시작 시 데이터 유지)
      - zookeeper-data:/var/lib/zookeeper/data
      # Zookeeper 트랜잭션 로그 영속화
      - zookeeper-log:/var/lib/zookeeper/log
    networks:
      - kafka-network
    # 헬스체크: Zookeeper가 정상 작동하는지 주기적으로 확인
    healthcheck:
      # ruok(Are you OK?) 명령으로 상태 확인 → "imok" 응답이면 정상
      test: echo ruok | nc localhost 2181 | grep imok
      # 10초마다 체크
      interval: 10s
      # 5초 내 응답 없으면 실패
      timeout: 5s
      # 5번 연속 실패하면 unhealthy 판정
      retries: 5
      # 컨테이너 시작 후 15초 대기 후 헬스체크 시작
      start_period: 15s

  ##########################################################################
  # ■■■ Kafka Broker 1 (리더 후보) ■■■
  # 메시지를 저장하고 프로듀서/컨슈머 요청을 처리하는 핵심 컴포넌트
  # broker.id=1 로 설정 (클러스터 내 고유 식별자)
  ##########################################################################
  kafka-broker-1:
    image: confluentinc/cp-kafka:${CONFLUENT_VERSION:-7.6.0}
    container_name: kafka-broker-1
    hostname: kafka-broker-1
    restart: unless-stopped
    # Zookeeper가 정상 작동해야 브로커 시작
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      # 호스트에서 접근할 때 사용하는 포트 (EXTERNAL 리스너)
      - "${KAFKA_BROKER1_EXTERNAL_PORT:-9092}:9092"
    environment:
      # ── 기본 설정 ──
      # 브로커 고유 ID (클러스터 내에서 유일해야 함)
      KAFKA_BROKER_ID: 1
      # Zookeeper 연결 주소
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # ── 리스너 설정 (네트워크 통신 구성) ──
      # INTERNAL: 브로커 간 통신 (Docker 네트워크 내부)
      # EXTERNAL: 호스트 머신에서의 접근용
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      # 브로커가 바인딩할 주소 (0.0.0.0 = 모든 인터페이스)
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      # 클라이언트에게 알려줄 접속 주소
      # INTERNAL: Docker 내부 컨테이너끼리 통신할 때
      # EXTERNAL: 호스트(로컬 PC)에서 접속할 때
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-broker-1:29092,EXTERNAL://localhost:${KAFKA_BROKER1_EXTERNAL_PORT:-9092}
      # 브로커 간 통신에 사용할 리스너 이름
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # ── 토픽 기본 설정 ──
      # 토픽 자동 생성 활성화 (프로덕션에서는 비활성화 권장)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: ${KAFKA_AUTO_CREATE_TOPICS:-true}
      # 기본 파티션 수 (병렬 처리 단위)
      KAFKA_NUM_PARTITIONS: ${KAFKA_DEFAULT_PARTITIONS:-3}
      # 기본 리플리케이션 팩터 (데이터 복제본 수, 브로커 수 이하로 설정)
      KAFKA_DEFAULT_REPLICATION_FACTOR: ${KAFKA_DEFAULT_REPLICATION:-3}
      # 최소 ISR(In-Sync Replicas) 수 - 이 수만큼 복제되어야 쓰기 성공
      KAFKA_MIN_INSYNC_REPLICAS: ${KAFKA_MIN_ISR:-2}

      # ── 로그 설정 ──
      # 세그먼트 로그 보존 기간 (시간 단위, 168시간 = 7일)
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_LOG_RETENTION_HOURS:-168}
      # 세그먼트 파일 최대 크기 (1GB)
      KAFKA_LOG_SEGMENT_BYTES: ${KAFKA_LOG_SEGMENT_BYTES:-1073741824}
      # 로그 보존 체크 주기 (밀리초, 5분)
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000

      # ── 성능 설정 ──
      # 네트워크 요청 처리 스레드 수
      KAFKA_NUM_NETWORK_THREADS: 3
      # 디스크 I/O 처리 스레드 수
      KAFKA_NUM_IO_THREADS: 8
      # 소켓 송신 버퍼 크기 (100KB)
      KAFKA_SOCKET_SEND_BUFFER_BYTES: 102400
      # 소켓 수신 버퍼 크기 (100KB)
      KAFKA_SOCKET_RECEIVE_BUFFER_BYTES: 102400
      # 요청 최대 크기 (100MB)
      KAFKA_SOCKET_REQUEST_MAX_BYTES: 104857600

      # ── __consumer_offsets 토픽 설정 ──
      # 컨슈머 오프셋 저장 토픽의 리플리케이션 팩터
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_REPLICATION:-3}
      # 트랜잭션 상태 토픽 리플리케이션 팩터
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

      # JVM 힙 메모리 설정
      KAFKA_HEAP_OPTS: "-Xmx${KAFKA_HEAP_SIZE:-512M} -Xms${KAFKA_HEAP_SIZE:-512M}"
    volumes:
      # Kafka 로그(메시지 데이터) 영속화
      - kafka-broker-1-data:/var/lib/kafka/data
    networks:
      - kafka-network
    # 헬스체크: 브로커 메타데이터 조회로 상태 확인
    healthcheck:
      test: kafka-broker-api-versions --bootstrap-server localhost:29092 > /dev/null 2>&1
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  ##########################################################################
  # ■■■ Kafka Broker 2 ■■■
  # broker.id=2, 외부 포트 9093
  ##########################################################################
  kafka-broker-2:
    image: confluentinc/cp-kafka:${CONFLUENT_VERSION:-7.6.0}
    container_name: kafka-broker-2
    hostname: kafka-broker-2
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "${KAFKA_BROKER2_EXTERNAL_PORT:-9093}:9093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29093,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-broker-2:29093,EXTERNAL://localhost:${KAFKA_BROKER2_EXTERNAL_PORT:-9093}
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: ${KAFKA_AUTO_CREATE_TOPICS:-true}
      KAFKA_NUM_PARTITIONS: ${KAFKA_DEFAULT_PARTITIONS:-3}
      KAFKA_DEFAULT_REPLICATION_FACTOR: ${KAFKA_DEFAULT_REPLICATION:-3}
      KAFKA_MIN_INSYNC_REPLICAS: ${KAFKA_MIN_ISR:-2}
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_LOG_RETENTION_HOURS:-168}
      KAFKA_LOG_SEGMENT_BYTES: ${KAFKA_LOG_SEGMENT_BYTES:-1073741824}
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      KAFKA_NUM_NETWORK_THREADS: 3
      KAFKA_NUM_IO_THREADS: 8
      KAFKA_SOCKET_SEND_BUFFER_BYTES: 102400
      KAFKA_SOCKET_RECEIVE_BUFFER_BYTES: 102400
      KAFKA_SOCKET_REQUEST_MAX_BYTES: 104857600
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_REPLICATION:-3}
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_HEAP_OPTS: "-Xmx${KAFKA_HEAP_SIZE:-512M} -Xms${KAFKA_HEAP_SIZE:-512M}"
    volumes:
      - kafka-broker-2-data:/var/lib/kafka/data
    networks:
      - kafka-network
    healthcheck:
      test: kafka-broker-api-versions --bootstrap-server localhost:29093 > /dev/null 2>&1
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  ##########################################################################
  # ■■■ Kafka Broker 3 ■■■
  # broker.id=3, 외부 포트 9094
  ##########################################################################
  kafka-broker-3:
    image: confluentinc/cp-kafka:${CONFLUENT_VERSION:-7.6.0}
    container_name: kafka-broker-3
    hostname: kafka-broker-3
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "${KAFKA_BROKER3_EXTERNAL_PORT:-9094}:9094"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29094,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-broker-3:29094,EXTERNAL://localhost:${KAFKA_BROKER3_EXTERNAL_PORT:-9094}
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: ${KAFKA_AUTO_CREATE_TOPICS:-true}
      KAFKA_NUM_PARTITIONS: ${KAFKA_DEFAULT_PARTITIONS:-3}
      KAFKA_DEFAULT_REPLICATION_FACTOR: ${KAFKA_DEFAULT_REPLICATION:-3}
      KAFKA_MIN_INSYNC_REPLICAS: ${KAFKA_MIN_ISR:-2}
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_LOG_RETENTION_HOURS:-168}
      KAFKA_LOG_SEGMENT_BYTES: ${KAFKA_LOG_SEGMENT_BYTES:-1073741824}
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      KAFKA_NUM_NETWORK_THREADS: 3
      KAFKA_NUM_IO_THREADS: 8
      KAFKA_SOCKET_SEND_BUFFER_BYTES: 102400
      KAFKA_SOCKET_RECEIVE_BUFFER_BYTES: 102400
      KAFKA_SOCKET_REQUEST_MAX_BYTES: 104857600
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_REPLICATION:-3}
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_HEAP_OPTS: "-Xmx${KAFKA_HEAP_SIZE:-512M} -Xms${KAFKA_HEAP_SIZE:-512M}"
    volumes:
      - kafka-broker-3-data:/var/lib/kafka/data
    networks:
      - kafka-network
    healthcheck:
      test: kafka-broker-api-versions --bootstrap-server localhost:29094 > /dev/null 2>&1
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  ##########################################################################
  # ■■■ Kafka UI (provectuslabs/kafka-ui) ■■■
  # 웹 브라우저에서 Kafka 클러스터를 모니터링/관리할 수 있는 GUI 도구
  # 접속 주소: http://localhost:8080
  # 기능: 토픽 조회/생성/삭제, 메시지 조회, 컨슈머 그룹 모니터링 등
  ##########################################################################
  kafka-ui:
    image: provectuslabs/kafka-ui:${KAFKA_UI_VERSION:-latest}
    container_name: kafka-ui
    hostname: kafka-ui
    restart: unless-stopped
    # 모든 브로커가 정상 작동해야 UI 시작
    depends_on:
      kafka-broker-1:
        condition: service_healthy
      kafka-broker-2:
        condition: service_healthy
      kafka-broker-3:
        condition: service_healthy
    ports:
      # Kafka UI 웹 포트
      - "${KAFKA_UI_PORT:-8080}:8080"
    environment:
      # 관리할 Kafka 클러스터 설정
      # 클러스터 이름 (UI에 표시됨)
      KAFKA_CLUSTERS_0_NAME: ${KAFKA_CLUSTER_NAME:-local-kafka-cluster}
      # 브로커 접속 주소 목록 (Docker 내부 통신이므로 INTERNAL 리스너 사용)
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-broker-1:29092,kafka-broker-2:29093,kafka-broker-3:29094
      # Zookeeper 접속 주소 (추가 메타데이터 조회용)
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      # 메시지 조회 시 최대 크기 (1MB)
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: ""
      # 인증 비활성화 (실습 환경)
      AUTH_TYPE: "DISABLED"
      # 동적 설정 변경 허용
      DYNAMIC_CONFIG_ENABLED: "true"
    networks:
      - kafka-network

# ■■■ 볼륨 정의 ■■■
# Docker Named Volume을 사용하여 데이터 영속화
# 컨테이너를 삭제해도 볼륨은 유지됨 (docker-compose down -v 로 삭제 가능)
volumes:
  # Zookeeper 데이터 볼륨
  zookeeper-data:
    driver: local
  # Zookeeper 트랜잭션 로그 볼륨
  zookeeper-log:
    driver: local
  # Kafka 브로커 1 데이터 볼륨
  kafka-broker-1-data:
    driver: local
  # Kafka 브로커 2 데이터 볼륨
  kafka-broker-2-data:
    driver: local
  # Kafka 브로커 3 데이터 볼륨
  kafka-broker-3-data:
    driver: local

# ■■■ 네트워크 정의 ■■■
# 모든 서비스가 동일 네트워크에서 통신
networks:
  kafka-network:
    # bridge 드라이버: 단일 호스트 내 컨테이너 간 통신
    driver: bridge
    name: kafka-network
