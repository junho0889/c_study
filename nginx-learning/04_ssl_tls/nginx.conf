# ┌─────────────────────────────────────────────────────────────────────────┐
# │  Nginx 학습 04단계: SSL/TLS 설정 (HTTPS)                               │
# └─────────────────────────────────────────────────────────────────────────┘
# HTTPS는 브라우저와 서버 사이의 통신을 암호화하는 것입니다.
# 비유: 편지를 보낼 때 봉투에 넣고 봉인하는 것과 같습니다.
#       HTTP = 엽서 (누구나 내용을 읽을 수 있음)
#       HTTPS = 봉투 편지 (받는 사람만 열어볼 수 있음)

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # ┌─────────────────────────────────────────────────────────┐
    # │  SSL 기본 설정 (모든 서버 블록에 공통 적용)              │
    # └─────────────────────────────────────────────────────────┘

    # SSL 프로토콜 버전 설정
    # 비유: 자물쇠의 세대를 고르는 것
    #   SSLv3  : 1세대 자물쇠 (취약점 많음, 절대 사용 금지!)
    #   TLSv1  : 2세대 (오래됨, 비권장)
    #   TLSv1.1: 3세대 (오래됨, 비권장)
    #   TLSv1.2: 4세대 (현재 표준, 반드시 포함)
    #   TLSv1.3: 5세대 (최신, 가장 안전하고 빠름)
    ssl_protocols TLSv1.2 TLSv1.3;

    # 암호화 방식(cipher suite) 설정
    # 비유: 자물쇠의 비밀번호 조합 방식을 고르는 것
    # 약한 암호화 방식은 제외해야 합니다!
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';

    # 서버 측 암호화 방식 우선 사용
    # 비유: "손님이 원하는 자물쇠가 아니라, 가게가 추천하는 안전한 자물쇠를 사용"
    ssl_prefer_server_ciphers on;

    # SSL 세션 캐시 (성능 최적화)
    # 비유: 한 번 악수(handshake)한 손님의 정보를 기억하여
    #       다음에 다시 만나면 빠르게 인사할 수 있게 하는 것
    ssl_session_cache shared:SSL:10m;   # 10MB 공유 캐시
    ssl_session_timeout 1d;              # 하루 동안 세션 유지

    # SSL 세션 티켓 (TLSv1.2에서 재연결 속도 향상)
    ssl_session_tickets off;    # 보안을 위해 끄는 것이 좋습니다

    # ┌─────────────────────────────────────────────────────────┐
    # │  서버 1: HTTP → HTTPS 리다이렉트                        │
    # └─────────────────────────────────────────────────────────┘
    # HTTP(80포트)로 접속하면 HTTPS(443포트)로 자동 전환합니다.
    # 비유: 일반 문으로 들어온 손님을 보안 문으로 안내하는 것
    server {
        listen 80;
        server_name lesson.example.com;

        # 301 영구 리다이렉트: "이제부터 항상 HTTPS로 오세요"
        # 302 임시 리다이렉트보다 301이 SEO에 좋습니다.
        return 301 https://$host$request_uri;
    }

    # ┌─────────────────────────────────────────────────────────┐
    # │  서버 2: HTTPS 메인 서버                                │
    # └─────────────────────────────────────────────────────────┘
    server {
        listen 443 ssl;
        # HTTP/2 활성화 (HTTPS에서만 사용 가능, 더 빠른 프로토콜)
        # 비유: 일반 도로(HTTP/1.1) 대신 고속도로(HTTP/2) 사용
        http2 on;
        server_name lesson.example.com;

        # ┌─────────────────────────────────────────────┐
        # │  SSL 인증서 파일 경로                        │
        # └─────────────────────────────────────────────┘
        # 인증서(crt): 신분증 (브라우저에게 "나는 진짜 lesson.example.com이야" 증명)
        # 개인 키(key): 도장 (인증서의 소유자만 가지고 있는 비밀 키)
        #
        # Let's Encrypt로 무료 인증서 발급:
        #   certbot --nginx -d lesson.example.com
        #   인증서 경로: /etc/letsencrypt/live/lesson.example.com/
        ssl_certificate     /etc/nginx/ssl/lesson.example.com.crt;
        ssl_certificate_key /etc/nginx/ssl/lesson.example.com.key;

        # 인증서 체인 파일 (Let's Encrypt 사용 시)
        # ssl_certificate     /etc/letsencrypt/live/lesson.example.com/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/lesson.example.com/privkey.pem;

        # ┌─────────────────────────────────────────────┐
        # │  HSTS (HTTP Strict Transport Security)       │
        # └─────────────────────────────────────────────┘
        # 브라우저에게 "앞으로 1년 동안은 항상 HTTPS로만 접속해"라고 알립니다.
        # 비유: "이 건물은 보안 구역이니, 항상 보안 문으로만 출입하세요"
        #
        # max-age=31536000 : 1년 (초 단위)
        # includeSubDomains: 하위 도메인도 적용 (sub.lesson.example.com)
        # preload: 브라우저의 HSTS 프리로드 목록에 등록 요청
        #
        # 주의: HSTS를 켜면 HTTP로 접속하는 것이 불가능해집니다!
        #       인증서가 만료되면 사이트에 접속할 수 없게 되므로
        #       인증서 자동 갱신을 반드시 설정하세요.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ┌─────────────────────────────────────────────┐
        # │  OCSP Stapling (인증서 유효성 검증 최적화)   │
        # └─────────────────────────────────────────────┘
        # 브라우저가 인증서가 아직 유효한지 확인하는 과정을 최적화합니다.
        # 비유: "이 신분증이 진짜인지 매번 경찰서에 전화하는 대신,
        #        서버가 미리 확인한 결과를 첨부해서 보여주는 것"
        ssl_stapling on;
        ssl_stapling_verify on;

        # OCSP 응답 검증에 사용할 신뢰 인증서 (CA 인증서)
        # ssl_trusted_certificate /etc/nginx/ssl/ca-bundle.crt;

        # DNS 해석기 (OCSP 서버 접근에 필요)
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;

        # ┌─────────────────────────────────────────────┐
        # │  프록시 설정 (실제 앱 서버로 전달)            │
        # └─────────────────────────────────────────────┘
        location / {
            proxy_pass http://app:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # HTTPS로 접속했음을 뒤쪽 서버에 알려줍니다.
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

# =============================================================================
# Let's Encrypt 인증서 발급 가이드:
# ─────────────────────────────────
# 1. Certbot 설치:
#    apt install certbot python3-certbot-nginx
#
# 2. 인증서 발급 (nginx 자동 설정):
#    certbot --nginx -d lesson.example.com
#
# 3. 인증서 자동 갱신 테스트:
#    certbot renew --dry-run
#
# 4. 자동 갱신 cron 등록 (보통 자동 설정됨):
#    0 12 * * * /usr/bin/certbot renew --quiet
#
# 테스트용 자체 서명 인증서 생성:
#    openssl req -x509 -nodes -days 365 \
#      -newkey rsa:2048 \
#      -keyout lesson.example.com.key \
#      -out lesson.example.com.crt \
#      -subj "/CN=lesson.example.com"
#
# SSL 설정 확인 사이트:
#    https://www.ssllabs.com/ssltest/
# =============================================================================
