# ┌─────────────────────────────────────────────────────────────────────────┐
# │  Nginx 학습 07단계: 보안 헤더 (Security Headers)                       │
# └─────────────────────────────────────────────────────────────────────────┘
# HTTP 응답 헤더에 보안 관련 설정을 추가하여
# XSS, 클릭재킹, MIME 스니핑 등의 공격을 방어합니다.
#
# 비유: 택배 상자에 "취급 주의", "깨지기 쉬움" 스티커를 붙이는 것처럼,
#       응답에 "이렇게 처리해 주세요"라는 지시를 브라우저에 보내는 것

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # ┌─────────────────────────────────────────────────────────┐
    # │  서버 버전 숨기기                                       │
    # └─────────────────────────────────────────────────────────┘
    # 기본적으로 Nginx는 응답 헤더에 "Server: nginx/1.27.0"을 넣습니다.
    # 공격자에게 서버 종류와 버전을 알려주면 취약점 공격에 활용됩니다!
    # 비유: 집 대문에 "이 집은 OO 자물쇠를 사용합니다"라고 적어 놓는 것
    server_tokens off;

    # ┌─────────────────────────────────────────────────────────┐
    # │  요청 크기 제한                                         │
    # └─────────────────────────────────────────────────────────┘
    # 비정상적으로 큰 요청을 차단합니다.
    # 비유: 우편함에 너무 큰 택배는 넣을 수 없는 것
    client_max_body_size 10m;        # 요청 본문 최대 10MB
    client_body_timeout 10s;         # 본문 수신 제한 시간 10초
    client_header_timeout 10s;       # 헤더 수신 제한 시간 10초

    # 요청 헤더 크기 제한 (비정상 요청 차단)
    large_client_header_buffers 4 8k;  # 헤더 버퍼 4개, 각 8KB

    server {
        listen 80;
        server_name localhost;

        # =============================================================
        # 보안 헤더 모음
        # =============================================================

        # ┌─────────────────────────────────────────────┐
        # │  1. X-Frame-Options (클릭재킹 방지)          │
        # └─────────────────────────────────────────────┘
        # 다른 사이트가 우리 페이지를 <iframe>으로 가져가는 것을 방지합니다.
        # 비유: "우리 가게 간판을 다른 가게에 걸 수 없습니다"
        #
        # DENY        : 어디에서도 iframe 불가
        # SAMEORIGIN  : 같은 도메인에서만 iframe 허용
        # ALLOW-FROM  : 특정 도메인에서만 허용 (대부분의 브라우저 미지원)
        add_header X-Frame-Options "SAMEORIGIN" always;

        # ┌─────────────────────────────────────────────┐
        # │  2. X-Content-Type-Options (MIME 스니핑 방지) │
        # └─────────────────────────────────────────────┘
        # 브라우저가 파일 유형을 "추측"하지 못하게 합니다.
        # 비유: "약 봉지에 적힌 대로만 복용하세요.
        #        임의로 다른 약이라고 판단하지 마세요."
        #
        # 공격 예시: JavaScript 코드를 이미지 파일로 위장하여 업로드한 후,
        #           브라우저가 "이건 JS인 것 같은데" 하고 실행하면 위험!
        # nosniff를 설정하면 Content-Type 헤더를 반드시 따르게 합니다.
        add_header X-Content-Type-Options "nosniff" always;

        # ┌─────────────────────────────────────────────┐
        # │  3. X-XSS-Protection (XSS 필터)              │
        # └─────────────────────────────────────────────┘
        # 브라우저의 XSS 필터를 활성화합니다.
        # 비유: 편지에 독이 묻어 있는지 검사하는 것
        #
        # 1: 필터 활성화
        # mode=block: XSS 탐지 시 페이지를 아예 차단
        #
        # 참고: 최신 브라우저에서는 CSP가 이 역할을 대체하므로
        #       X-XSS-Protection은 레거시 브라우저용입니다.
        add_header X-XSS-Protection "1; mode=block" always;

        # ┌─────────────────────────────────────────────┐
        # │  4. Content-Security-Policy (CSP)            │
        # └─────────────────────────────────────────────┘
        # 웹 페이지에서 로드할 수 있는 리소스의 출처를 제한합니다.
        # 이것이 XSS 공격에 대한 가장 강력한 방어입니다!
        #
        # 비유: "우리 가게에서는 인증된 납품업체의 물건만 진열합니다"
        #       모르는 곳에서 가져온 스크립트(코드)는 실행하지 않습니다.
        #
        # 주요 지시어:
        #   default-src : 기본 정책 (다른 지시어가 없을 때 적용)
        #   script-src  : JavaScript 출처
        #   style-src   : CSS 출처
        #   img-src     : 이미지 출처
        #   font-src    : 폰트 출처
        #   connect-src : AJAX/WebSocket 연결 출처
        #   frame-ancestors : iframe에 포함 가능한 출처 (X-Frame-Options 대체)
        #
        # 값:
        #   'self'         : 같은 도메인만 허용
        #   'none'         : 모두 차단
        #   'unsafe-inline': 인라인 스크립트/스타일 허용 (비권장)
        #   https:         : HTTPS 출처만 허용
        #   특정 도메인     : 해당 도메인만 허용
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; frame-ancestors 'self';" always;

        # ┌─────────────────────────────────────────────┐
        # │  5. Referrer-Policy (리퍼러 정책)            │
        # └─────────────────────────────────────────────┘
        # 다른 사이트로 이동할 때 "어디에서 왔는지" 정보를 얼마나 공개할지 정합니다.
        # 비유: 택배를 보낼 때 보내는 사람 정보를 어디까지 적을지
        #
        # no-referrer              : 리퍼러 정보를 전혀 보내지 않음
        # same-origin              : 같은 도메인일 때만 리퍼러 전송
        # strict-origin-when-cross-origin : 다른 도메인으로 갈 때는 도메인만 전송
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ┌─────────────────────────────────────────────┐
        # │  6. Permissions-Policy (기능 정책)            │
        # └─────────────────────────────────────────────┘
        # 브라우저 기능(카메라, 마이크, 위치 등)의 사용을 제한합니다.
        # 비유: "이 웹사이트는 카메라를 사용하지 않습니다" 선언
        #
        # () = 기능을 완전히 차단
        # (self) = 같은 도메인에서만 허용
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

        # ┌─────────────────────────────────────────────┐
        # │  7. CORS (Cross-Origin Resource Sharing)     │
        # └─────────────────────────────────────────────┘
        # 다른 도메인에서 우리 서버의 리소스를 요청할 수 있는지 제어합니다.
        # 비유: "다른 가게 직원이 우리 가게 물건을 가져갈 수 있는지"
        #
        # API 서버에서 주로 사용합니다.
        location /api/ {
            # 허용할 출처 (특정 도메인 또는 * 전체)
            # 주의: *는 모든 도메인을 허용하므로 보안상 위험합니다!
            add_header Access-Control-Allow-Origin "https://lesson.example.com" always;

            # 허용할 HTTP 메서드
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;

            # 허용할 요청 헤더
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;

            # 자격 증명(쿠키, 인증 헤더) 허용
            add_header Access-Control-Allow-Credentials "true" always;

            # 프리플라이트 요청 캐시 시간 (초)
            # 비유: "출입 허가를 받으면 1시간 동안 다시 물어보지 않아도 돼"
            add_header Access-Control-Max-Age "3600" always;

            # OPTIONS 프리플라이트 요청 처리
            # 브라우저가 실제 요청 전에 "이 요청을 보내도 되나요?" 확인하는 것
            if ($request_method = OPTIONS) {
                return 204;
            }

            proxy_pass http://app:8080;
        }

        # ┌─────────────────────────────────────────────┐
        # │  민감한 파일 접근 차단                       │
        # └─────────────────────────────────────────────┘
        # .env, .git, .htaccess 등 민감한 파일에 대한 접근을 차단합니다.
        # 비유: "직원 전용 문서함에는 접근할 수 없습니다"
        location ~ /\. {
            deny all;
            return 404;
        }

        location / {
            proxy_pass http://app:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}

# =============================================================================
# 보안 헤더 확인 방법:
# ────────────────────
# 1. curl로 응답 헤더 확인:
#    curl -I http://localhost/
#
# 2. 온라인 검사 사이트:
#    https://securityheaders.com/
#    https://observatory.mozilla.org/
#
# 3. 브라우저 개발자 도구 (F12) → Network 탭 → 응답 헤더 확인
#
# 보안 점수 등급:
#    A+ : 모든 보안 헤더가 올바르게 설정됨
#    F  : 보안 헤더가 거의 없음
# =============================================================================
