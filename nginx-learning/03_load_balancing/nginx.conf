worker_processes 1;

events {
    worker_connections 1024;
}

http {
    upstream lesson_backend {
        # 같은 역할을 하는 서버를 여러 대 등록해 둡니다.
        # 한 명의 계산원 대신 두 명의 계산원이 번갈아 손님을 받는 모습과 비슷합니다.
        server app1:8080;
        server app2:8080;
    }

    server {
        listen 80;

        location / {
            # proxy_pass 대상을 upstream 이름으로 두면
            # nginx가 등록된 서버들 사이에 요청을 나눠 보냅니다.
            proxy_pass http://lesson_backend;
        }
    }
}
