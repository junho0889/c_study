# ┌─────────────────────────────────────────────────────────────────────────┐
# │  Nginx 학습 05단계: Rate Limiting (요청 속도 제한)                      │
# └─────────────────────────────────────────────────────────────────────────┘
# Rate Limiting은 클라이언트가 보내는 요청 수를 제한하는 것입니다.
# 비유: 놀이기구에 "1분에 10명까지만 탈 수 있습니다"라고 제한하는 것
#
# 왜 필요한가?
#   1. DDoS 공격 방어: 한 IP에서 수천 개의 요청을 보내는 것을 막음
#   2. 서버 보호: 과도한 요청으로 서버가 다운되는 것을 방지
#   3. 공정한 사용: 한 사용자가 자원을 독점하지 못하게 함
#   4. API 사용량 관리: API 키별로 호출 횟수 제한

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # ┌─────────────────────────────────────────────────────────┐
    # │  limit_req_zone: 요청 속도 제한 영역 정의               │
    # └─────────────────────────────────────────────────────────┘
    # 형식: limit_req_zone <키> zone=<이름>:<크기> rate=<속도>
    #
    # $binary_remote_addr : 클라이언트 IP 기준 (바이너리 형태, 메모리 절약)
    # zone=basic:10m      : "basic"이라는 이름의 10MB 공유 메모리 영역
    #                       (약 16만 개의 IP 주소 저장 가능)
    # rate=10r/s           : 초당 10개 요청 허용
    #
    # 비유: 놀이공원 입구에 "1분당 입장 인원 제한" 표지판을 세우는 것
    #       IP별로 별도의 카운터가 생깁니다.
    limit_req_zone $binary_remote_addr zone=basic:10m rate=10r/s;

    # API 전용 제한 (더 엄격하게)
    # 비유: VIP 라운지 입구는 더 엄격한 인원 제한
    limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;

    # 로그인 페이지 전용 제한 (브루트포스 공격 방어)
    # 비유: 금고실 입구에는 1분에 2번만 시도 가능
    limit_req_zone $binary_remote_addr zone=login:10m rate=2r/s;

    # ┌─────────────────────────────────────────────────────────┐
    # │  limit_conn_zone: 동시 연결 수 제한 영역 정의           │
    # └─────────────────────────────────────────────────────────┘
    # 한 IP에서 동시에 유지할 수 있는 연결 수를 제한합니다.
    # 비유: "한 사람이 놀이기구 좌석을 3개 이상 차지할 수 없습니다"
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    # Rate limit 초과 시 반환할 HTTP 상태 코드
    # 기본값은 503이지만, API에서는 429(Too Many Requests)가 표준입니다.
    limit_req_status 429;
    limit_conn_status 429;

    # Rate limit 로그 레벨 설정
    # 비유: "입장 거부된 손님 기록을 어느 정도로 남길지"
    limit_req_log_level warn;

    # ┌─────────────────────────────────────────────────────────┐
    # │  화이트리스트: 특정 IP는 제한에서 제외                   │
    # └─────────────────────────────────────────────────────────┘
    # 비유: "직원은 인원 제한 없이 자유롭게 출입 가능"
    geo $limit {
        default         1;           # 기본: 제한 적용
        127.0.0.1       0;           # 로컬호스트: 제한 제외
        10.0.0.0/8      0;           # 내부 네트워크: 제한 제외
        192.168.0.0/16  0;           # 내부 네트워크: 제한 제외
    }

    # 화이트리스트에 있으면($limit=0) 빈 문자열이 되어 limit_req가 무시됩니다.
    map $limit $limit_key {
        0   "";                      # 제한 제외 대상
        1   $binary_remote_addr;     # 제한 적용 대상
    }

    # 화이트리스트 적용 영역
    limit_req_zone $limit_key zone=whitelist_aware:10m rate=10r/s;

    server {
        listen 80;
        server_name localhost;

        # ┌─────────────────────────────────────────────┐
        # │  일반 페이지: 기본 Rate Limiting              │
        # └─────────────────────────────────────────────┘
        location / {
            # limit_req zone=<영역이름> [burst=<버스트>] [nodelay|delay=N]
            #
            # burst: 순간적으로 허용할 추가 요청 수
            # 비유: "보통은 1분에 10명인데, 잠깐 줄이 밀리면 20명까지 봐줄게"
            #       burst 범위 안의 요청은 큐에 넣고 천천히 처리합니다.
            #
            # nodelay: burst 범위 안의 요청을 큐에 넣지 않고 즉시 처리
            # 비유: "20명까지는 바로 들여보내고, 그 이후부터 줄 서세요"
            #
            # delay=N: 처음 N개는 즉시 처리, 나머지는 큐에서 대기
            # 비유: "처음 5명은 바로 통과, 나머지 15명은 줄 서세요"
            limit_req zone=basic burst=20 nodelay;

            # 동시 연결 수 제한: IP당 최대 10개 동시 연결
            limit_conn conn_per_ip 10;

            proxy_pass http://app:8080;
        }

        # ┌─────────────────────────────────────────────┐
        # │  API 엔드포인트: 엄격한 Rate Limiting        │
        # └─────────────────────────────────────────────┘
        location /api/ {
            # API는 더 엄격하게 제한합니다.
            # burst=10: 순간적으로 10개 추가 허용
            # delay=5: 처음 5개는 즉시, 나머지 5개는 큐에서 대기
            limit_req zone=api burst=10 delay=5;
            limit_conn conn_per_ip 5;

            proxy_pass http://app:8080;

            # Rate limit 초과 시 사용자에게 안내 헤더 추가
            # 비유: "잠시 후에 다시 시도해 주세요" 안내판
            add_header X-RateLimit-Limit "5" always;
            add_header Retry-After "1" always;
        }

        # ┌─────────────────────────────────────────────┐
        # │  로그인 페이지: 매우 엄격한 제한              │
        # └─────────────────────────────────────────────┘
        location /login {
            # 브루트포스 공격(비밀번호를 무작위로 시도) 방어
            # 초당 2개 요청만 허용, burst 5개
            # 비유: "비밀번호 입력은 천천히 해주세요"
            limit_req zone=login burst=5 nodelay;

            proxy_pass http://app:8080;
        }

        # ┌─────────────────────────────────────────────┐
        # │  화이트리스트 적용 예시                       │
        # └─────────────────────────────────────────────┘
        location /internal/ {
            # 내부 네트워크에서는 제한 없이 접근 가능
            limit_req zone=whitelist_aware burst=50 nodelay;
            proxy_pass http://app:8080;
        }

        # Rate limit 초과 시 커스텀 에러 페이지
        error_page 429 /429.html;
        location = /429.html {
            internal;
            default_type text/html;
            return 429 '<html><body><h1>요청이 너무 많습니다</h1><p>잠시 후 다시 시도해 주세요.</p></body></html>';
        }
    }
}

# =============================================================================
# 테스트 방법:
# ─────────────
# 1. 정상 요청:
#    curl http://localhost/
#
# 2. Rate limit 테스트 (연속 요청):
#    for i in $(seq 1 30); do curl -s -o /dev/null -w "%{http_code}\n" http://localhost/; done
#    → 처음 20개는 200, 이후는 429가 나와야 합니다.
#
# 3. API rate limit 테스트:
#    for i in $(seq 1 20); do curl -s -o /dev/null -w "%{http_code}\n" http://localhost/api/test; done
#
# 4. 로그 확인:
#    tail -f /var/log/nginx/error.log | grep "limiting"
# =============================================================================
