# ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
# ■■■ WebSocket 프록시 설정 (websocket.conf)            ■■■
# ■■■ 실시간 양방향 통신을 위한 WebSocket 프록시 규칙   ■■■
# ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
#
# WebSocket 프로토콜:
#   - HTTP 요청으로 시작하여 WebSocket으로 업그레이드
#   - 전이중(full-duplex) 통신: 클라이언트↔서버 동시 양방향
#   - 채팅, 실시간 알림, 게임, 주식 시세 등에 사용

# ■■■ WebSocket 업그레이드 헤더 매핑 ■■■
# map: $http_upgrade 헤더 값에 따라 $connection_upgrade 변수 설정
#   클라이언트가 Upgrade: websocket 헤더를 보내면 → Connection: upgrade
#   일반 HTTP 요청이면 → Connection: close
map $http_upgrade $connection_upgrade {
    default upgrade;    # Upgrade 헤더가 있으면 → "upgrade"
    ''      close;      # Upgrade 헤더가 없으면 → "close" (일반 HTTP)
}

server {
    listen 80;                                  # HTTP 80번 포트
    server_name ws.localhost;                   # WebSocket 전용 서브도메인

    # ■■■ WebSocket 기본 경로 ■■■
    location /ws/ {
        proxy_pass http://websocket_servers;    # WebSocket 업스트림으로 프록시

        # HTTP/1.1 필수: WebSocket은 HTTP/1.1의 Upgrade 메커니즘 사용
        proxy_http_version 1.1;

        # ■■■ WebSocket 업그레이드 헤더 ■■■
        # Upgrade: 프로토콜 전환 요청 (HTTP → WebSocket)
        proxy_set_header Upgrade $http_upgrade;

        # Connection: 업그레이드 지시 (map에서 정의한 변수 사용)
        proxy_set_header Connection $connection_upgrade;

        # ■■■ 클라이언트 정보 전달 헤더 ■■■
        proxy_set_header Host $host;                           # 원본 호스트
        proxy_set_header X-Real-IP $remote_addr;               # 클라이언트 IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # 프록시 체인
        proxy_set_header X-Forwarded-Proto $scheme;            # 프로토콜

        # ■■■ 타임아웃 설정 (WebSocket은 장시간 연결) ■■■
        # proxy_read_timeout: 업스트림에서 데이터를 읽는 타임아웃
        #   WebSocket은 유휴 시간이 길 수 있으므로 1시간으로 설정
        #   이 시간 동안 데이터 수신이 없으면 연결 종료
        proxy_read_timeout 3600s;

        # proxy_send_timeout: 업스트림으로 데이터를 전송하는 타임아웃
        proxy_send_timeout 3600s;

        # ■■■ 버퍼링 비활성화 ■■■
        # WebSocket은 실시간 데이터 전달이 중요하므로 버퍼링 끔
        proxy_buffering off;            # 응답 버퍼링 비활성화
        proxy_cache off;                # 캐시 비활성화

        # ■■■ TCP 최적화 ■■■
        # tcp_nodelay: 작은 패킷도 즉시 전송 (실시간성 향상)
        tcp_nodelay on;
    }

    # ■■■ Socket.IO 전용 경로 ■■■
    # Socket.IO는 /socket.io/ 경로를 기본으로 사용
    location /socket.io/ {
        proxy_pass http://websocket_servers;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Socket.IO는 polling fallback을 사용하므로 일반 HTTP도 허용
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ■■■ 헬스체크 (WebSocket 서버 상태 확인) ■■■
    location /ws/health {
        access_log off;
        proxy_pass http://websocket_servers;
        proxy_connect_timeout 3s;
        proxy_read_timeout 3s;
    }
}
