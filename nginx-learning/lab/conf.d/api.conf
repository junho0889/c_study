# ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
# ■■■ API 리버스 프록시 설정 (api.conf)                 ■■■
# ■■■ REST API 백엔드로의 프록시 규칙 정의              ■■■
# ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
#
# 이 파일은 nginx.conf의 http 블록 내에서 include 됨
# API 엔드포인트별 세부 프록시 설정을 분리하여 관리

# ─────────────────────────────────────────────
# ■■■ API v1 서버 블록 ■■■
# ─────────────────────────────────────────────
# 별도의 server 블록 대신 location 블록으로 사용할 경우
# nginx.conf의 server 블록 안에 직접 include 하세요.
# 여기서는 독립 server 블록으로 구성합니다.

server {
    listen 80;                          # HTTP 80번 포트
    server_name api.localhost;          # API 전용 서브도메인 (로컬 테스트용)

    # ■■■ 공통 보안 헤더 ■■■
    add_header X-Frame-Options "DENY" always;               # API는 iframe 완전 차단
    add_header X-Content-Type-Options "nosniff" always;     # MIME 스니핑 방지
    add_header X-XSS-Protection "1; mode=block" always;     # XSS 필터

    # ■■■ API 버전 v1 ■■■
    location /api/v1/ {
        # Rate Limiting: API 요청 속도 제한
        #   burst=20: 순간적으로 20개까지 초과 요청 허용
        #   nodelay: burst 내 요청은 지연 없이 즉시 처리
        limit_req zone=api_limit burst=20 nodelay;

        # 백엔드 서버로 프록시 전달
        #   /api/v1/users → app:5000/api/v1/users (경로 그대로 전달)
        proxy_pass http://backend_servers;

        # ■■■ 프록시 헤더 설정 ■■■
        proxy_set_header Host $host;                           # 원본 Host 헤더 전달
        proxy_set_header X-Real-IP $remote_addr;               # 실제 클라이언트 IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # 프록시 체인 IP
        proxy_set_header X-Forwarded-Proto $scheme;            # 프로토콜 (http/https)
        proxy_set_header X-Request-ID $request_id;             # 요청 추적용 고유 ID

        # ■■■ 타임아웃 설정 ■■■
        proxy_connect_timeout 5s;     # 업스트림 연결 타임아웃 (빠르게 실패)
        proxy_send_timeout 30s;       # 요청 전송 타임아웃
        proxy_read_timeout 30s;       # 응답 읽기 타임아웃

        # ■■■ 캐시 비활성화 (API는 실시간 데이터) ■■■
        proxy_no_cache 1;             # 캐시에 저장하지 않음
        proxy_cache_bypass 1;         # 캐시를 우회하고 업스트림에 직접 요청
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;

        # ■■■ CORS 설정 ■■■
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, X-Request-ID" always;
        add_header Access-Control-Expose-Headers "X-Request-ID, X-RateLimit-Remaining" always;
        add_header Access-Control-Max-Age 86400 always;      # 프리플라이트 캐시 24시간

        # OPTIONS 프리플라이트 요청 처리
        if ($request_method = 'OPTIONS') {
            return 204;               # 204 No Content (본문 없이 헤더만 반환)
        }
    }

    # ■■■ 로그인 엔드포인트 (엄격한 Rate Limiting) ■■■
    location /api/v1/auth/login {
        # 브루트포스 공격 방지: 초당 1개 요청, burst 5개
        limit_req zone=login_limit burst=5 nodelay;

        proxy_pass http://backend_servers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 요청 본문 크기 제한 (로그인은 작은 데이터만 필요)
        client_max_body_size 1k;      # 1KB로 제한
    }

    # ■■■ 파일 업로드 엔드포인트 (큰 본문 허용) ■■■
    location /api/v1/upload {
        proxy_pass http://backend_servers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # 파일 업로드를 위한 큰 본문 허용
        client_max_body_size 100m;     # 최대 100MB 파일 업로드
        client_body_buffer_size 10m;   # 10MB까지 메모리에 버퍼링

        # 업로드 타임아웃 연장
        proxy_read_timeout 120s;       # 2분 (큰 파일 처리 시간 확보)
        proxy_send_timeout 120s;
    }

    # ■■■ 헬스체크 엔드포인트 ■■■
    location /api/health {
        access_log off;                # 로그 남기지 않음 (모니터링 도구의 반복 요청)
        proxy_pass http://backend_servers;
        proxy_connect_timeout 3s;      # 빠르게 실패하여 상태 확인
        proxy_read_timeout 3s;
    }

    # ■■■ 존재하지 않는 API 경로 처리 ■■■
    location /api/ {
        return 404 '{"error": "Not Found", "message": "API endpoint not found"}';
        add_header Content-Type application/json always;
    }
}
