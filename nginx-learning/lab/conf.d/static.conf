# ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
# ■■■ 정적 파일 서빙 설정 (static.conf)                ■■■
# ■■■ 이미지, CSS, JS, 폰트 등 정적 리소스 최적화      ■■■
# ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■

server {
    listen 80;                              # HTTP 80번 포트
    server_name static.localhost;           # 정적 파일 전용 서브도메인

    # ■■■ 루트 디렉토리 ■■■
    root /var/www/static;                   # 정적 파일 기본 루트 디렉토리

    # ■■■ 보안 헤더 ■■■
    add_header X-Content-Type-Options "nosniff" always;   # MIME 스니핑 방지
    add_header X-Frame-Options "SAMEORIGIN" always;       # 클릭재킹 방지

    # ■■■ 이미지 파일 서빙 ■■■
    location ~* \.(jpg|jpeg|png|gif|ico|webp|avif|svg)$ {
        expires 365d;                       # 1년 캐시 (이미지는 거의 변하지 않음)
        add_header Cache-Control "public, immutable";  # immutable: 캐시 기간 내 재검증 안함
        access_log off;                     # 이미지 요청 로그 비활성화 (디스크 I/O 절약)
        log_not_found off;                  # 이미지 404 에러 로그 비활성화

        # try_files: 요청 파일이 없으면 기본 placeholder 이미지 반환
        try_files $uri /images/placeholder.png =404;
    }

    # ■■■ CSS/JavaScript 파일 서빙 ■■■
    location ~* \.(css|js)$ {
        expires 7d;                         # 7일 캐시 (CSS/JS는 배포 시 변경될 수 있음)
        add_header Cache-Control "public";  # 공용 캐시 허용 (CDN에서도 캐시)
        access_log off;

        # Gzip 사전 압축 파일 제공
        #   .gz 파일이 있으면 먼저 제공 (빌드 시 사전 압축)
        gzip_static on;
    }

    # ■■■ 폰트 파일 서빙 ■■■
    location ~* \.(woff|woff2|ttf|eot|otf)$ {
        expires 365d;                       # 1년 캐시
        add_header Cache-Control "public, immutable";
        access_log off;

        # CORS 허용 (폰트는 다른 도메인에서 로드할 때 CORS 필요)
        add_header Access-Control-Allow-Origin "*" always;
    }

    # ■■■ HTML 파일 서빙 ■■■
    location ~* \.html$ {
        expires 1h;                         # 1시간 캐시 (자주 변경될 수 있음)
        add_header Cache-Control "public, must-revalidate";  # 만료 시 서버에 재검증 요청

        # try_files: 요청한 파일 → index.html → 404
        try_files $uri /index.html =404;
    }

    # ■■■ 기본 Location ■■■
    location / {
        # try_files: 파일 → 디렉토리의 index.html → 404
        try_files $uri $uri/index.html =404;

        # 디렉토리 인덱스 파일
        index index.html;

        # autoindex: 디렉토리 목록 표시 (개발용, 프로덕션에서는 off)
        autoindex off;
    }

    # ■■■ 숨김 파일 접근 차단 ■■■
    location ~ /\. {
        deny all;                           # .htaccess, .git 등 접근 차단
        return 404;
    }

    # ■■■ 에러 페이지 ■■■
    error_page 404 /404.html;
    location = /404.html {
        internal;                           # 외부에서 직접 접근 불가
    }
}
