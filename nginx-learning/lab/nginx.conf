# ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
# ■■■ Nginx 마스터 설정 파일 (nginx.conf)               ■■■
# ■■■ 프로덕션 레디 설정 + 한국어 주석 완벽 가이드      ■■■
# ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
#
# Nginx 설정 파일 구조:
#   main (전역) → events → http → server → location
#   각 블록은 상위 블록의 설정을 상속받음
#

# ■■■ 전역 설정 (Main Context) ■■■

# worker_processes: 워커 프로세스 수
#   - auto: CPU 코어 수만큼 자동 설정 (권장)
#   - 수동 설정 시 CPU 코어 수와 동일하게 (nproc 명령으로 확인)
#   - 마스터 프로세스(1개) + 워커 프로세스(N개) 구조
worker_processes auto;

# error_log: 에러 로그 파일 경로 및 로그 레벨
#   레벨: debug | info | notice | warn | error | crit | alert | emerg
#   프로덕션에서는 warn 이상 권장 (debug는 성능 저하 유발)
error_log /var/log/nginx/error.log warn;

# pid: Nginx 마스터 프로세스 PID 파일 경로
#   nginx -s reload/stop 등 시그널 전송 시 이 파일 참조
pid /var/run/nginx.pid;

# worker_rlimit_nofile: 워커 프로세스당 열 수 있는 최대 파일 디스크립터 수
#   worker_connections의 2배 이상 설정 권장
#   OS의 ulimit -n 값도 함께 조정해야 함
worker_rlimit_nofile 65535;

# ■■■ 이벤트 블록 (Events Context) ■■■
# 네트워크 연결 처리 방식 설정
events {
    # worker_connections: 워커 프로세스당 최대 동시 연결 수
    #   총 동시 연결 = worker_processes × worker_connections
    #   예: 4 × 4096 = 16,384 동시 연결
    worker_connections 4096;

    # use: 이벤트 처리 메커니즘 선택
    #   epoll: Linux (가장 효율적)
    #   kqueue: FreeBSD/macOS
    #   select/poll: 범용 (성능 낮음)
    # Linux 환경에서는 epoll이 기본값이므로 명시하지 않아도 됨
    # use epoll;

    # multi_accept: 한 번에 여러 연결 수락 여부
    #   on: 워커가 한 번에 모든 대기 중인 연결 수락 (처리량 증가)
    #   off: 한 번에 하나씩 수락 (기본값)
    multi_accept on;

    # accept_mutex: 워커 프로세스 간 연결 수락 뮤텍스
    #   on: 워커가 순차적으로 연결 수락 (thundering herd 방지)
    #   off: 모든 워커가 동시에 연결 수락 시도
    accept_mutex off;
}

# ■■■ HTTP 블록 (HTTP Context) ■■■
# HTTP 서버 관련 전체 설정
http {

    # ─────────────────────────────────────────────
    # ■■■ 기본 설정 ■■■
    # ─────────────────────────────────────────────

    # include: MIME 타입 매핑 파일 포함
    #   파일 확장자 → Content-Type 헤더 매핑
    include /etc/nginx/mime.types;

    # default_type: MIME 타입을 알 수 없는 파일의 기본 Content-Type
    #   application/octet-stream: 바이너리 파일로 다운로드 처리
    default_type application/octet-stream;

    # charset: 응답의 기본 문자 인코딩
    charset utf-8;

    # server_tokens: Nginx 버전 정보 노출 여부
    #   off: 응답 헤더와 에러 페이지에서 버전 정보 숨김 (보안)
    server_tokens off;

    # ─────────────────────────────────────────────
    # ■■■ 로그 설정 ■■■
    # ─────────────────────────────────────────────

    # log_format: 커스텀 로그 포맷 정의
    #   $remote_addr: 클라이언트 IP 주소
    #   $remote_user: HTTP 인증된 사용자 이름
    #   $time_local: 로컬 시간 (예: 21/Mar/2026:10:00:00 +0900)
    #   $request: 요청 라인 (예: GET /api/data HTTP/1.1)
    #   $status: HTTP 응답 상태 코드
    #   $body_bytes_sent: 응답 본문 바이트 수
    #   $http_referer: Referer 헤더 (이전 페이지 URL)
    #   $http_user_agent: User-Agent 헤더 (브라우저/클라이언트 정보)
    #   $request_time: 요청 처리 시간 (초, 밀리초 포함)
    #   $upstream_response_time: 업스트림 서버 응답 시간
    #   $upstream_addr: 업스트림 서버 주소
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time urt=$upstream_response_time '
                    'ua=$upstream_addr';

    # JSON 형식 로그 포맷 (ELK, Loki 등 로그 수집 시스템 연동 시 유용)
    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'              # ISO 8601 형식 시간
            '"remote_addr":"$remote_addr",'         # 클라이언트 IP
            '"request":"$request",'                 # 요청 라인
            '"status":$status,'                     # 상태 코드 (숫자)
            '"body_bytes_sent":$body_bytes_sent,'   # 응답 크기
            '"request_time":$request_time,'         # 처리 시간
            '"upstream_response_time":"$upstream_response_time",' # 업스트림 응답 시간
            '"http_referrer":"$http_referer",'      # 리퍼러
            '"http_user_agent":"$http_user_agent"'  # 유저 에이전트
        '}';

    # access_log: 접근 로그 파일 경로 및 포맷
    #   buffer=32k: 32KB 버퍼에 로그를 모아서 한번에 기록 (I/O 최적화)
    #   flush=5s: 5초마다 버퍼를 파일에 기록
    access_log /var/log/nginx/access.log main buffer=32k flush=5s;

    # ─────────────────────────────────────────────
    # ■■■ 성능 최적화 설정 ■■■
    # ─────────────────────────────────────────────

    # sendfile: 커널 레벨에서 파일 전송 (zero-copy)
    #   on: 파일을 커널 메모리에서 직접 소켓으로 전송 (빠름)
    #   off: 유저 스페이스를 거쳐 전송 (느림)
    sendfile on;

    # tcp_nopush: sendfile 사용 시 TCP 패킷을 최적화
    #   on: 응답 헤더와 파일 데이터를 하나의 패킷으로 전송
    #   sendfile on과 함께 사용해야 효과적
    tcp_nopush on;

    # tcp_nodelay: TCP Nagle 알고리즘 비활성화
    #   on: 작은 패킷도 즉시 전송 (지연 시간 감소)
    #   keepalive 연결에서 효과적
    tcp_nodelay on;

    # keepalive_timeout: Keep-Alive 연결 유지 시간 (초)
    #   클라이언트가 연결을 재사용할 수 있는 최대 시간
    #   너무 길면 연결이 많아지고, 너무 짧으면 연결 재생성 오버헤드 발생
    keepalive_timeout 65;

    # keepalive_requests: 하나의 Keep-Alive 연결에서 처리할 최대 요청 수
    keepalive_requests 1000;

    # client_max_body_size: 클라이언트 요청 본문 최대 크기
    #   파일 업로드 크기 제한 (초과 시 413 Request Entity Too Large)
    client_max_body_size 50m;

    # client_body_buffer_size: 요청 본문을 메모리에 저장할 버퍼 크기
    #   이 크기를 초과하면 임시 파일에 기록
    client_body_buffer_size 128k;

    # client_header_buffer_size: 요청 헤더 버퍼 크기
    client_header_buffer_size 4k;

    # large_client_header_buffers: 큰 요청 헤더를 위한 버퍼
    #   4개의 8KB 버퍼 할당 (쿠키가 큰 경우 등)
    large_client_header_buffers 4 8k;

    # types_hash_max_size: MIME 타입 해시 테이블 크기
    types_hash_max_size 2048;

    # ─────────────────────────────────────────────
    # ■■■ Gzip 압축 설정 ■■■
    # ─────────────────────────────────────────────

    # gzip: 응답 압축 활성화
    #   텍스트 기반 응답을 압축하여 전송 대역폭 절약 (60-80% 절감)
    gzip on;

    # gzip_vary: Vary: Accept-Encoding 헤더 추가
    #   CDN/프록시가 압축 여부에 따라 캐시를 구분하도록 함
    gzip_vary on;

    # gzip_proxied: 프록시 요청에 대한 압축 조건
    #   any: 모든 프록시 요청에 대해 압축
    gzip_proxied any;

    # gzip_comp_level: 압축 레벨 (1-9)
    #   1: 빠르지만 압축률 낮음
    #   9: 느리지만 압축률 높음
    #   6: 속도와 압축률의 균형점 (권장)
    gzip_comp_level 6;

    # gzip_min_length: 압축 최소 응답 크기 (바이트)
    #   256바이트 미만은 압축 효과 미미하므로 제외
    gzip_min_length 256;

    # gzip_types: 압축할 MIME 타입 목록
    #   text/html은 기본 포함이므로 명시 불필요
    gzip_types
        text/plain                  # 일반 텍스트
        text/css                    # CSS 스타일시트
        text/javascript             # JavaScript (구 표준)
        text/xml                    # XML
        application/json            # JSON API 응답
        application/javascript      # JavaScript (현 표준)
        application/xml             # XML
        application/xml+rss         # RSS 피드
        application/vnd.ms-fontobject  # EOT 폰트
        font/opentype               # OpenType 폰트
        image/svg+xml;              # SVG 이미지

    # gzip_buffers: 압축용 버퍼 설정
    #   16개의 8KB 버퍼 할당
    gzip_buffers 16 8k;

    # ─────────────────────────────────────────────
    # ■■■ Rate Limiting (요청 속도 제한) ■■■
    # ─────────────────────────────────────────────

    # limit_req_zone: 요청 속도 제한 영역 정의
    #   $binary_remote_addr: 클라이언트 IP를 바이너리 형태로 저장 (메모리 절약)
    #   zone=api_limit:10m: "api_limit" 이름의 10MB 공유 메모리 영역
    #     → 약 160,000개 IP 주소 저장 가능 (1IP = ~64바이트)
    #   rate=10r/s: 초당 10개 요청 허용 (100ms당 1개)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # 일반 페이지용 속도 제한 (초당 30개 요청)
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

    # 로그인 페이지용 엄격한 속도 제한 (브루트포스 방지)
    #   초당 1개 요청만 허용
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=1r/s;

    # limit_req_status: 속도 제한 초과 시 반환할 HTTP 상태 코드
    #   429: Too Many Requests (HTTP 표준)
    limit_req_status 429;

    # limit_req_log_level: 속도 제한 로그 레벨
    limit_req_log_level warn;

    # ─────────────────────────────────────────────
    # ■■■ 연결 수 제한 ■■■
    # ─────────────────────────────────────────────

    # limit_conn_zone: 동시 연결 수 제한 영역
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ─────────────────────────────────────────────
    # ■■■ 프록시 캐시 설정 ■■■
    # ─────────────────────────────────────────────

    # proxy_cache_path: 캐시 저장 경로 및 설정
    #   /var/cache/nginx: 캐시 파일 저장 디렉토리
    #   levels=1:2: 2단계 하위 디렉토리 구조 (예: /cache/a/1b/...)
    #     → 한 디렉토리에 파일이 너무 많아지는 것 방지
    #   keys_zone=proxy_cache:10m: 캐시 키 저장 공유 메모리 (10MB ≈ 80,000개 키)
    #   max_size=1g: 캐시 최대 디스크 크기 1GB
    #   inactive=60m: 60분간 접근 없으면 캐시 삭제
    #   use_temp_path=off: 임시 경로 사용 안 함 (불필요한 파일 복사 방지)
    proxy_cache_path /var/cache/nginx levels=1:2
                     keys_zone=proxy_cache:10m
                     max_size=1g
                     inactive=60m
                     use_temp_path=off;

    # ─────────────────────────────────────────────
    # ■■■ 업스트림 서버 정의 (로드밸런싱) ■■■
    # ─────────────────────────────────────────────

    # upstream: 백엔드 서버 그룹 정의
    # 기본 알고리즘: round-robin (순차 분배)
    upstream backend_servers {
        # ■■■ 로드밸런싱 알고리즘 (하나만 선택) ■■■
        #
        # 1. round-robin (기본값): 서버에 순차적으로 요청 분배
        #    → 별도 지시어 불필요, 기본 동작
        #
        # 2. least_conn: 활성 연결이 가장 적은 서버로 요청 분배
        #    → 요청 처리 시간이 불균일할 때 유용
        # least_conn;
        #
        # 3. ip_hash: 클라이언트 IP 기반 해싱으로 같은 서버에 분배
        #    → 세션 유지(Sticky Session)가 필요할 때 사용
        # ip_hash;
        #
        # 4. hash: 지정한 키 기반 해싱
        # hash $request_uri consistent;
        #    → consistent: 서버 추가/제거 시 재분배 최소화

        # ■■■ 서버 목록 ■■■
        # weight: 가중치 (기본값 1, 높을수록 더 많은 요청 수신)
        # max_fails: 연속 실패 횟수 제한 (초과 시 서버 비활성화)
        # fail_timeout: 비활성화 후 재시도까지 대기 시간
        server app1:5000 weight=3 max_fails=3 fail_timeout=30s;   # Flask 서버 #1 (가중치 3)
        server app2:5000 weight=2 max_fails=3 fail_timeout=30s;   # Flask 서버 #2 (가중치 2)
        server app3:3000 weight=1 max_fails=3 fail_timeout=30s;   # Node.js 서버 #3 (가중치 1)

        # backup: 다른 모든 서버가 다운되었을 때만 사용되는 백업 서버
        # server backup-app:5000 backup;

        # keepalive: 업스트림 서버와의 Keep-Alive 연결 풀 크기
        #   각 워커 프로세스가 유지할 연결 수
        keepalive 32;
    }

    # WebSocket 전용 업스트림 (필요 시 별도 분리)
    upstream websocket_servers {
        # ip_hash: WebSocket은 세션 유지가 필요하므로 ip_hash 사용
        ip_hash;
        server app1:5000;
        server app2:5000;
    }

    # ─────────────────────────────────────────────
    # ■■■ SSL/TLS 공통 설정 ■■■
    # ─────────────────────────────────────────────

    # ssl_protocols: 허용할 TLS 프로토콜 버전
    #   TLSv1, TLSv1.1은 보안 취약하므로 비활성화
    #   TLSv1.2, TLSv1.3만 허용 (현대 보안 표준)
    ssl_protocols TLSv1.2 TLSv1.3;

    # ssl_ciphers: 허용할 암호화 알고리즘 목록
    #   ECDHE: 완전 순방향 비밀성(Forward Secrecy) 지원
    #   AES-GCM: 인증된 암호화 (빠르고 안전)
    #   CHACHA20: 모바일 기기에서 AES보다 빠름
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';

    # ssl_prefer_server_ciphers: 서버 측 암호화 알고리즘 우선
    #   on: 서버가 선호하는 cipher suite 사용 (보안 강화)
    ssl_prefer_server_ciphers on;

    # ssl_session_cache: SSL 세션 캐시 설정
    #   shared:SSL:50m: 50MB 공유 메모리 (약 200,000 세션)
    #   SSL 핸드셰이크 오버헤드 감소
    ssl_session_cache shared:SSL:50m;

    # ssl_session_timeout: SSL 세션 캐시 유효 시간
    ssl_session_timeout 1d;

    # ssl_session_tickets: SSL 세션 티켓 비활성화
    #   보안 이유로 off 권장 (완전 순방향 비밀성 보장)
    ssl_session_tickets off;

    # ssl_stapling: OCSP Stapling 활성화
    #   인증서 유효성 검사를 서버가 미리 수행하여 클라이언트에 전달
    #   클라이언트의 OCSP 요청 지연 시간 제거
    # ssl_stapling on;
    # ssl_stapling_verify on;

    # ─────────────────────────────────────────────
    # ■■■ 보안 헤더 (Security Headers) ■■■
    # ─────────────────────────────────────────────

    # ※ map 지시어: 변수 값에 따라 다른 값을 매핑
    #   $sent_http_content_type에 따라 보안 헤더 적용 여부 결정

    # X-Content-Type-Options: MIME 타입 스니핑 방지
    #   nosniff: 브라우저가 Content-Type을 무시하고 타입을 추측하는 것을 방지
    map $sent_http_content_type $x_content_type_options {
        default "nosniff";    # 모든 응답에 nosniff 적용
    }

    # ─────────────────────────────────────────────
    # ■■■ 프록시 공통 설정 ■■■
    # ─────────────────────────────────────────────

    # proxy_http_version: 업스트림과의 HTTP 프로토콜 버전
    #   1.1: Keep-Alive 지원 (1.0은 매 요청마다 연결 생성)
    proxy_http_version 1.1;

    # proxy_set_header: 업스트림으로 전달할 헤더 설정
    #   Host: 원본 요청의 Host 헤더 전달
    proxy_set_header Host $host;

    #   X-Real-IP: 실제 클라이언트 IP 전달
    proxy_set_header X-Real-IP $remote_addr;

    #   X-Forwarded-For: 프록시 체인의 모든 IP 전달
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    #   X-Forwarded-Proto: 원본 요청의 프로토콜 (http/https)
    proxy_set_header X-Forwarded-Proto $scheme;

    # proxy_connect_timeout: 업스트림 서버 연결 타임아웃
    proxy_connect_timeout 10s;

    # proxy_send_timeout: 업스트림으로 요청 전송 타임아웃
    proxy_send_timeout 30s;

    # proxy_read_timeout: 업스트림 응답 읽기 타임아웃
    proxy_read_timeout 30s;

    # proxy_buffering: 업스트림 응답 버퍼링
    #   on: 응답을 버퍼에 저장 후 클라이언트에 전송 (기본값)
    proxy_buffering on;

    # proxy_buffer_size: 응답 첫 부분(헤더) 버퍼 크기
    proxy_buffer_size 8k;

    # proxy_buffers: 응답 본문 버퍼 (8개 × 8KB)
    proxy_buffers 8 8k;

    # proxy_busy_buffers_size: 클라이언트에 전송 중인 버퍼 최대 크기
    proxy_busy_buffers_size 16k;

    # ─────────────────────────────────────────────
    # ■■■ 기본 서버 블록 (HTTP → HTTPS 리다이렉트) ■■■
    # ─────────────────────────────────────────────
    server {
        listen 80 default_server;       # 80번 포트에서 수신 (기본 서버)
        listen [::]:80 default_server;  # IPv6 80번 포트에서 수신
        server_name _;                  # 모든 도메인에 대해 응답

        # ■■■ Certbot ACME 챌린지 경로 ■■■
        # Let's Encrypt 인증서 발급 시 사용하는 검증 경로
        location /.well-known/acme-challenge/ {
            root /var/lib/letsencrypt;  # ACME 챌린지 파일 루트
            default_type "text/plain";  # 응답 타입
        }

        # ■■■ 헬스체크 엔드포인트 ■■■
        # 로드밸런서, 모니터링 시스템에서 사용
        location /health {
            access_log off;             # 헬스체크 로그 기록 안 함 (로그 노이즈 방지)
            return 200 'OK';            # 단순 200 응답
            add_header Content-Type text/plain;  # 응답 타입 명시
        }

        # ■■■ API 요청 → 백엔드로 프록시 ■■■
        location /api/ {
            # Rate Limiting 적용
            #   burst=20: 초과 요청 20개까지 큐에 대기
            #   nodelay: 대기 없이 즉시 처리 (burst 초과 시 429)
            limit_req zone=api_limit burst=20 nodelay;

            # 동시 연결 수 제한: IP당 최대 10개 연결
            limit_conn conn_limit 10;

            # 프록시 캐시 사용
            proxy_cache proxy_cache;

            # 캐시 키: 요청 메소드 + 호스트 + URI 조합
            proxy_cache_key "$request_method$host$request_uri";

            # GET, HEAD 요청의 200 응답을 10분간 캐시
            proxy_cache_valid 200 10m;

            # 404 응답을 1분간 캐시 (동일 요청 반복 방지)
            proxy_cache_valid 404 1m;

            # X-Cache-Status 헤더로 캐시 적중 여부 확인
            #   HIT: 캐시에서 응답
            #   MISS: 업스트림에서 응답
            #   BYPASS: 캐시 우회
            add_header X-Cache-Status $upstream_cache_status;

            # 업스트림 서버로 요청 전달
            proxy_pass http://backend_servers;

            # Keep-Alive 연결 유지를 위한 헤더
            proxy_set_header Connection "";
        }

        # ■■■ 보안 헤더 적용 (모든 응답) ■■■
        # X-Frame-Options: iframe 삽입 방지 (클릭재킹 방지)
        #   DENY: 모든 iframe 차단
        #   SAMEORIGIN: 같은 출처만 허용
        add_header X-Frame-Options "SAMEORIGIN" always;

        # X-Content-Type-Options: MIME 스니핑 방지
        add_header X-Content-Type-Options "nosniff" always;

        # X-XSS-Protection: XSS 필터 활성화 (레거시 브라우저용)
        add_header X-XSS-Protection "1; mode=block" always;

        # Referrer-Policy: 리퍼러 정보 전송 정책
        #   strict-origin-when-cross-origin: 같은 출처에는 전체 URL, 다른 출처에는 출처만
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Content-Security-Policy: 콘텐츠 보안 정책
        #   어떤 출처의 리소스를 로드할 수 있는지 제한
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'" always;

        # Permissions-Policy: 브라우저 기능 접근 제한 (카메라, 마이크 등)
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # ■■■ CORS 설정 (Cross-Origin Resource Sharing) ■■■
        # 다른 도메인에서의 API 호출 허용
        location ~* ^/api/public/ {
            # 허용할 출처 (프로덕션에서는 특정 도메인으로 변경)
            add_header Access-Control-Allow-Origin "*" always;
            # 허용할 HTTP 메서드
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            # 허용할 요청 헤더
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
            # 프리플라이트 캐시 시간 (초)
            add_header Access-Control-Max-Age 3600 always;

            # OPTIONS 프리플라이트 요청 처리
            if ($request_method = 'OPTIONS') {
                return 204;   # No Content (본문 없이 헤더만 응답)
            }

            proxy_pass http://backend_servers;
        }

        # ■■■ 정적 파일 서빙 ■■■
        location /static/ {
            alias /var/www/static/;           # 정적 파일 디렉토리
            expires 30d;                       # 브라우저 캐시 30일 (Cache-Control: max-age)
            add_header Cache-Control "public, immutable";  # 변경 불가 캐시
            access_log off;                    # 정적 파일 접근 로그 비활성화 (성능)

            # try_files: 파일 존재 여부 확인 후 순서대로 시도
            #   $uri: 요청한 파일 경로
            #   =404: 파일이 없으면 404 에러
            try_files $uri =404;

            # 특정 파일 타입별 캐시 기간 설정
            location ~* \.(jpg|jpeg|png|gif|ico|webp|avif)$ {
                expires 1y;                    # 이미지: 1년 캐시
                add_header Cache-Control "public, immutable";
            }

            location ~* \.(css|js)$ {
                expires 7d;                    # CSS/JS: 7일 캐시
                add_header Cache-Control "public";
            }

            location ~* \.(woff|woff2|ttf|eot)$ {
                expires 1y;                    # 폰트: 1년 캐시
                add_header Cache-Control "public, immutable";
                add_header Access-Control-Allow-Origin "*";  # 폰트는 CORS 필요
            }
        }

        # ■■■ WebSocket 프록시 ■■■
        location /ws/ {
            proxy_pass http://websocket_servers;
            proxy_http_version 1.1;

            # WebSocket 업그레이드 헤더
            #   Connection: Upgrade → HTTP 연결을 WebSocket으로 업그레이드
            #   Upgrade: websocket → WebSocket 프로토콜로 전환
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # WebSocket 타임아웃 (유휴 시간)
            #   기본 60초이지만, WebSocket은 장시간 연결이므로 늘림
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ■■■ Location 매칭 우선순위 예시 ■■■
        # 1. = (정확 매칭): 가장 높은 우선순위
        location = /favicon.ico {
            log_not_found off;     # favicon 없어도 에러 로그 남기지 않음
            access_log off;        # 접근 로그도 남기지 않음
            expires 1y;
        }

        # 2. ^~ (접두사 매칭, 정규식보다 우선)
        # location ^~ /images/ {
        #     root /var/www;
        # }

        # 3. ~* (정규식 매칭, 대소문자 무시)
        location ~* \.(txt|xml|json)$ {
            root /var/www;
            expires 1h;
        }

        # 4. / (기본 매칭, 가장 낮은 우선순위)
        location / {
            proxy_pass http://backend_servers;
            proxy_set_header Connection "";

            # try_files로 정적 파일 → 프록시 순서 시도
            # try_files $uri $uri/ @backend;
        }

        # ■■■ Named Location (이름 기반 위치 블록) ■■■
        # try_files의 fallback으로 사용
        location @backend {
            proxy_pass http://backend_servers;
        }

        # ■■■ 에러 페이지 설정 ■■■
        error_page 404 /404.html;           # 404 에러 시 커스텀 페이지
        error_page 500 502 503 504 /50x.html;  # 5xx 에러 시 커스텀 페이지

        location = /50x.html {
            root /usr/share/nginx/html;      # Nginx 기본 에러 페이지 경로
            internal;                         # 외부에서 직접 접근 불가
        }

        # ■■■ 숨김 파일 접근 차단 ■■■
        # .htaccess, .git, .env 등 숨김 파일/디렉토리 접근 방지
        location ~ /\. {
            deny all;                          # 모든 접근 거부
            access_log off;                    # 로그 안 남김
            log_not_found off;                 # 에러 로그도 안 남김
        }
    }

    # ─────────────────────────────────────────────
    # ■■■ HTTPS 서버 블록 (SSL/TLS) ■■■
    # ─────────────────────────────────────────────
    # 실제 SSL 인증서가 있을 때 주석 해제하여 사용
    #
    # server {
    #     listen 443 ssl http2;                   # HTTPS + HTTP/2 활성화
    #     listen [::]:443 ssl http2;              # IPv6 HTTPS + HTTP/2
    #     server_name yourdomain.com;             # 실제 도메인으로 변경
    #
    #     # ■■■ SSL 인증서 경로 (Let's Encrypt) ■■■
    #     ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    #
    #     # HSTS (HTTP Strict Transport Security)
    #     #   max-age=31536000: 1년간 HTTPS만 사용하도록 브라우저에 지시
    #     #   includeSubDomains: 서브도메인에도 적용
    #     #   preload: HSTS 프리로드 목록에 등록 가능
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    #
    #     # 나머지 location 설정은 HTTP 서버 블록과 동일하게 설정
    # }

    # ─────────────────────────────────────────────
    # ■■■ 모니터링 서버 블록 (stub_status) ■■■
    # ─────────────────────────────────────────────
    server {
        listen 8080;                    # 모니터링 전용 포트
        server_name localhost;

        # stub_status: Nginx 기본 상태 정보
        #   Active connections: 현재 활성 연결 수
        #   accepts: 수락한 총 연결 수
        #   handled: 처리한 총 연결 수
        #   requests: 처리한 총 요청 수
        #   Reading: 요청 헤더 읽는 중인 연결
        #   Writing: 응답 전송 중인 연결
        #   Waiting: Keep-Alive 대기 중인 유휴 연결
        location /nginx_status {
            stub_status on;            # 상태 페이지 활성화
            access_log off;            # 모니터링 요청은 로그 남기지 않음
            allow 127.0.0.1;           # 로컬에서만 접근 허용
            allow 172.16.0.0/12;       # Docker 네트워크에서 접근 허용
            deny all;                  # 나머지 모든 IP 차단
        }

        # Prometheus 등 모니터링 도구에서 사용할 수 있는 헬스 엔드포인트
        location /health {
            access_log off;
            return 200 '{"status":"healthy"}';
            add_header Content-Type application/json;
        }
    }

    # ─────────────────────────────────────────────
    # ■■■ 추가 설정 파일 포함 ■■■
    # ─────────────────────────────────────────────
    # conf.d 디렉토리의 모든 .conf 파일을 포함
    include /etc/nginx/conf.d/*.conf;
}
