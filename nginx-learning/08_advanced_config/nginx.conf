# ┌─────────────────────────────────────────────────────────────────────────┐
# │  Nginx 학습 08단계: 고급 설정 (Advanced Configuration)                 │
# └─────────────────────────────────────────────────────────────────────────┘
# 이 파일에서는 location 블록 우선순위, 정규식 매칭, rewrite 규칙,
# try_files, upstream 헬스체크, 로깅 커스터마이징을 다룹니다.
#
# 비유: 지금까지 기본 운전을 배웠다면,
#       이제 고급 주행 기술(코너링, 평행 주차 등)을 배우는 단계입니다.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # ┌─────────────────────────────────────────────────────────┐
    # │  커스텀 로그 포맷                                       │
    # └─────────────────────────────────────────────────────────┘
    # 기본 로그 형식 대신, 더 많은 정보를 포함한 형식을 정의합니다.
    # 비유: 출입 기록부에 "이름, 시간"만 적는 대신
    #       "이름, 시간, 방문 목적, 체류 시간, 반응"까지 적는 것
    log_format detailed '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" '
                        'rt=$request_time '         # 요청 처리 시간
                        'ua="$upstream_addr" '      # 백엔드 서버 주소
                        'us="$upstream_status" '    # 백엔드 응답 코드
                        'ut="$upstream_response_time" '  # 백엔드 응답 시간
                        'cs=$upstream_cache_status';     # 캐시 상태

    # JSON 형식 로그 (ELK, Fluentd 등 로그 수집 도구와 연동 시 유용)
    # 비유: 엑셀 표로 정리하면 나중에 검색하고 분석하기 편한 것처럼,
    #       JSON 형식은 로그 분석 도구가 읽기 편합니다.
    log_format json_log escape=json
        '{'
            '"time": "$time_iso8601", '
            '"remote_addr": "$remote_addr", '
            '"request": "$request", '
            '"status": $status, '
            '"body_bytes_sent": $body_bytes_sent, '
            '"request_time": $request_time, '
            '"user_agent": "$http_user_agent", '
            '"upstream_addr": "$upstream_addr", '
            '"upstream_response_time": "$upstream_response_time"'
        '}';

    # 로그 파일 지정
    access_log /var/log/nginx/access.log detailed;
    # JSON 로그를 별도 파일에 기록
    # access_log /var/log/nginx/access.json json_log;

    # 에러 로그 레벨: debug, info, notice, warn, error, crit, alert, emerg
    error_log /var/log/nginx/error.log warn;

    # 특정 경로의 로그를 끄기 (헬스체크 등 불필요한 로그 제거)
    # → 아래 location /health 에서 설정

    # ┌─────────────────────────────────────────────────────────┐
    # │  Upstream 설정 (헬스체크 포함)                           │
    # └─────────────────────────────────────────────────────────┘
    # 백엔드 서버 그룹을 정의하고, 건강하지 않은 서버를 자동 제외합니다.
    # 비유: 택시 회사에 기사 3명이 있는데,
    #       아픈 기사는 배차에서 제외하는 것
    upstream lesson_app {
        # ┌──────────────────────────────────────────┐
        # │  로드밸런싱 방식                          │
        # └──────────────────────────────────────────┘
        # 기본: round-robin (돌아가면서 배분)
        #
        # least_conn: 연결이 가장 적은 서버에 배분
        # 비유: "가장 한가한 계산대로 안내합니다"
        # least_conn;
        #
        # ip_hash: 같은 IP는 항상 같은 서버로 (세션 유지용)
        # 비유: "단골 손님은 항상 같은 직원이 응대"
        # ip_hash;
        #
        # hash: 특정 값 기준으로 분배
        # hash $request_uri consistent;

        server app1:8080 weight=3;   # 가중치 3 (요청을 3배 더 받음)
        server app2:8080 weight=2;   # 가중치 2
        server app3:8080 weight=1 backup;  # 백업 서버 (다른 서버 다운 시 사용)

        # ┌──────────────────────────────────────────┐
        # │  패시브 헬스체크                           │
        # └──────────────────────────────────────────┘
        # Nginx 오픈소스에서 사용 가능한 방식입니다.
        # max_fails: 이 횟수만큼 연속 실패하면 서버를 "다운"으로 표시
        # fail_timeout: 다운 표시 후 이 시간 동안 요청을 보내지 않음
        #
        # 비유: "배달이 3번 연속 실패하면 30초 동안 그 기사에게 배달을 안 맡김"
        # (각 server 줄에 옵션으로 추가 가능)
        # server app1:8080 max_fails=3 fail_timeout=30s;

        # 연결 유지 (Keep-alive)
        # 비유: 전화를 끊지 않고 계속 연결해 두는 것 (매번 전화 걸 필요 없음)
        keepalive 32;   # 유지할 연결 수
    }

    server {
        listen 80;
        server_name localhost;

        # =============================================================
        # Location 블록 우선순위 (매우 중요!)
        # =============================================================
        # Nginx는 요청 URL에 맞는 location 블록을 선택할 때
        # 아래 우선순위를 따릅니다:
        #
        # ┌─────┬────────────────────┬──────────────────────────────┐
        # │ 순위│ 문법               │ 설명                         │
        # ├─────┼────────────────────┼──────────────────────────────┤
        # │  1  │ location = /path   │ 정확히 일치 (exact match)    │
        # │  2  │ location ^~ /path  │ 접두사 일치 (우선, 정규식X)  │
        # │  3  │ location ~ regex   │ 정규식 매칭 (대소문자 구분)  │
        # │  3  │ location ~* regex  │ 정규식 매칭 (대소문자 무시)  │
        # │  4  │ location /path     │ 접두사 일치 (일반)           │
        # └─────┴────────────────────┴──────────────────────────────┘
        #
        # 비유: 택배 분류
        #   1. "정확히 101호" → 바로 배달 (= 정확 일치)
        #   2. "1층으로 시작하면 무조건 1층 안내데스크" (^~ 우선 접두사)
        #   3. "주소에 VIP가 포함되면 특별 배달" (~ 정규식)
        #   4. "1로 시작하면 1동" (일반 접두사)

        # ─── 우선순위 1: 정확히 일치 (=) ───
        # /health 로 정확히 접근할 때만 매칭됩니다.
        # /health/check, /health/ 등은 매칭되지 않습니다.
        location = /health {
            # 헬스체크 로그는 남기지 않음 (너무 많아서)
            access_log off;
            return 200 '{"status":"ok"}';
            default_type application/json;
        }

        # ─── 우선순위 2: 우선 접두사 (^~) ───
        # /static/으로 시작하는 모든 요청에 매칭됩니다.
        # 정규식보다 먼저 확인됩니다.
        location ^~ /static/ {
            alias /var/www/static/;
            expires 30d;
        }

        # ─── 우선순위 3: 정규식 매칭 (~) ───
        # 파일 확장자가 이미지인 요청에 매칭됩니다.
        location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
            root /var/www/images;
            expires 365d;
            add_header Cache-Control "public, immutable";

            # 이미지를 못 찾으면 기본 이미지 반환
            try_files $uri /default.png;
        }

        # ─── 우선순위 4: 일반 접두사 ───
        location /api/v1/ {
            proxy_pass http://lesson_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ┌─────────────────────────────────────────────┐
        # │  try_files: 파일 찾기 순서                   │
        # └─────────────────────────────────────────────┘
        # 여러 경로를 순서대로 시도하고, 다 없으면 마지막 동작을 실행합니다.
        # 비유: "1번 서랍에 없으면 2번 서랍을 보고,
        #        거기도 없으면 선생님한테 물어보기"
        location / {
            root /var/www/html;

            # try_files 순서:
            # 1. $uri          → 요청 경로 그대로 찾기 (/about.html)
            # 2. $uri/         → 디렉터리인지 확인 (/about/)
            # 3. /index.html   → SPA 프론트엔드의 경우 index.html로 폴백
            #
            # React, Vue 같은 SPA에서 필수!
            # /about 으로 직접 접근해도 index.html을 반환하여
            # 프론트엔드 라우터가 처리하게 합니다.
            try_files $uri $uri/ /index.html;
        }

        # ┌─────────────────────────────────────────────┐
        # │  Rewrite 규칙: URL 재작성                    │
        # └─────────────────────────────────────────────┘
        # URL을 다른 URL로 변환합니다.
        # 비유: "옛날 주소로 편지가 오면 새 주소로 전달해 줘"

        # 예 1: 오래된 URL을 새 URL로 리다이렉트
        # /old-page → /new-page (301 영구 리다이렉트)
        rewrite ^/old-page$ /new-page permanent;

        # 예 2: URL 구조 변경
        # /products/123 → /api/v1/products/123
        rewrite ^/products/(\d+)$ /api/v1/products/$1 last;

        # 예 3: 임시 리다이렉트 (302)
        # /event → /events/current
        rewrite ^/event$ /events/current redirect;

        # rewrite 플래그:
        #   last      : 새 URL로 다시 location 매칭 (내부 전달)
        #   break     : 현재 location에서 처리 (다시 매칭하지 않음)
        #   redirect  : 302 임시 리다이렉트
        #   permanent : 301 영구 리다이렉트

        # ┌─────────────────────────────────────────────┐
        # │  조건부 처리 (if)                            │
        # └─────────────────────────────────────────────┘
        # 주의: Nginx의 if는 일반 프로그래밍의 if와 다릅니다!
        # "If is Evil"이라는 유명한 경고가 있습니다.
        # 가능하면 map이나 try_files를 사용하세요.

        # 봇(크롤러)의 User-Agent 차단
        if ($http_user_agent ~* (badbot|scraper|spam)) {
            return 403;
        }

        # www. 없는 URL을 www.로 리다이렉트
        # if ($host !~* ^www\.) {
        #     return 301 https://www.$host$request_uri;
        # }

        # ┌─────────────────────────────────────────────┐
        # │  에러 페이지 커스터마이징                     │
        # └─────────────────────────────────────────────┘
        error_page 404 /custom_404.html;
        error_page 500 502 503 504 /custom_50x.html;

        location = /custom_404.html {
            internal;
            default_type text/html;
            return 404 '<html><body><h1>404 - 페이지를 찾을 수 없습니다</h1></body></html>';
        }

        location = /custom_50x.html {
            internal;
            default_type text/html;
            return 500 '<html><body><h1>서버 오류가 발생했습니다</h1><p>잠시 후 다시 시도해 주세요.</p></body></html>';
        }
    }
}

# =============================================================================
# Location 우선순위 테스트:
# ────────────────────────
# curl http://localhost/health           → 정확 일치 (=)
# curl http://localhost/static/style.css → 우선 접두사 (^~)
# curl http://localhost/photo.jpg        → 정규식 (~*)
# curl http://localhost/api/v1/users     → 일반 접두사
# curl http://localhost/about            → try_files → index.html
#
# Rewrite 디버깅:
#   error_log /var/log/nginx/error.log notice;
#   → rewrite 로그가 notice 레벨로 기록됩니다.
#   또는: rewrite_log on; 을 http 블록에 추가
#
# Nginx 설정 문법 검사:
#   nginx -t
#
# 설정 리로드 (서비스 중단 없이):
#   nginx -s reload
# =============================================================================
