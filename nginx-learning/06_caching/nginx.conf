# ┌─────────────────────────────────────────────────────────────────────────┐
# │  Nginx 학습 06단계: 캐싱 (Caching) & 압축 (Compression)                │
# └─────────────────────────────────────────────────────────────────────────┘
# 캐싱은 한 번 가져온 데이터를 저장해 두고, 다음에 같은 요청이 오면
# 저장된 데이터를 바로 돌려주는 것입니다.
#
# 비유: 도서관에서 인기 있는 책을 복사해 두고,
#       매번 서고(원본 서버)에 가지 않고 복사본을 빌려주는 것
#
# 캐싱의 장점:
#   1. 응답 속도 향상 (서버에 다시 물어보지 않으니까)
#   2. 서버 부하 감소 (같은 요청을 반복 처리하지 않으니까)
#   3. 대역폭 절약 (네트워크 트래픽 감소)

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # ┌─────────────────────────────────────────────────────────┐
    # │  proxy_cache_path: 캐시 저장소 설정                     │
    # └─────────────────────────────────────────────────────────┘
    # Nginx가 백엔드 서버의 응답을 파일로 저장하는 곳입니다.
    #
    # /var/cache/nginx    : 캐시 파일이 저장될 디렉터리
    # levels=1:2          : 디렉터리 구조 (해시 기반으로 분산 저장)
    #                       비유: 도서관 책장을 층별로 분류하는 것
    # keys_zone=my_cache:10m : 캐시 키를 저장하는 공유 메모리 (10MB)
    #                          약 8만 개의 키 저장 가능
    # max_size=1g         : 캐시 전체 최대 크기 (1GB)
    # inactive=60m        : 60분 동안 접근이 없으면 캐시에서 삭제
    # use_temp_path=off   : 임시 파일 없이 직접 캐시에 저장 (성능 향상)
    proxy_cache_path /var/cache/nginx levels=1:2
                     keys_zone=my_cache:10m
                     max_size=1g
                     inactive=60m
                     use_temp_path=off;

    # 정적 파일 전용 캐시 (이미지, CSS, JS 등)
    proxy_cache_path /var/cache/nginx/static levels=1:2
                     keys_zone=static_cache:5m
                     max_size=500m
                     inactive=7d;

    # ┌─────────────────────────────────────────────────────────┐
    # │  Gzip 압축 설정                                         │
    # └─────────────────────────────────────────────────────────┘
    # 응답 데이터를 압축하여 전송 크기를 줄입니다.
    # 비유: 택배를 보낼 때 진공 압축 팩으로 부피를 줄이는 것
    #       파일이 작아지니까 전송 시간이 줄어듭니다!
    gzip on;

    # 압축 레벨 (1=가장 빠름/약한 압축, 9=가장 느림/강한 압축)
    # 비유: 1은 가볍게 접기, 9는 꽉꽉 눌러 넣기
    # 보통 4~6이 속도와 압축률의 균형점입니다.
    gzip_comp_level 5;

    # 최소 이 크기 이상일 때만 압축 (너무 작은 파일은 압축 효과가 적음)
    gzip_min_length 256;

    # 프록시를 거친 요청도 압축
    gzip_proxied any;

    # 압축할 파일 유형 (MIME 타입)
    # text/html은 기본적으로 포함되므로 따로 적지 않아도 됩니다.
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Vary 헤더를 추가하여 프록시 서버가 압축/비압축 버전을 구분하게 합니다.
    gzip_vary on;

    server {
        listen 80;
        server_name localhost;

        # ┌─────────────────────────────────────────────┐
        # │  동적 콘텐츠 프록시 캐싱                     │
        # └─────────────────────────────────────────────┘
        # 백엔드 서버의 응답을 Nginx가 저장해 두고 재사용합니다.
        location / {
            proxy_cache my_cache;

            # ┌──────────────────────────────────────────┐
            # │  proxy_cache_key: 캐시 키 설정            │
            # └──────────────────────────────────────────┘
            # 어떤 기준으로 "같은 요청"인지 판단할지 정합니다.
            # 비유: 도서관에서 "같은 책"인지 제목+저자로 구분하는 것
            # $scheme(http/https) + $host(도메인) + $request_uri(경로+쿼리)
            proxy_cache_key "$scheme$request_method$host$request_uri";

            # ┌──────────────────────────────────────────┐
            # │  proxy_cache_valid: 캐시 유효 시간        │
            # └──────────────────────────────────────────┘
            # HTTP 상태 코드별로 캐시 유지 시간을 정합니다.
            # 비유: "정상 답변(200)은 10분간 기억하고,
            #        '못 찾겠다'(404)는 1분만 기억해"
            proxy_cache_valid 200 10m;     # 200 OK: 10분 캐시
            proxy_cache_valid 301 302 5m;  # 리다이렉트: 5분 캐시
            proxy_cache_valid 404 1m;      # Not Found: 1분 캐시
            proxy_cache_valid any 1m;      # 기타: 1분 캐시

            # 캐시 상태를 응답 헤더에 추가 (디버깅용)
            # HIT: 캐시에서 응답 / MISS: 백엔드에서 응답 / EXPIRED: 만료됨
            add_header X-Cache-Status $upstream_cache_status always;

            # 백엔드 서버가 다운되면 만료된 캐시라도 사용
            # 비유: "새 책을 못 가져오면 오래된 복사본이라도 빌려줘"
            proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;

            # 캐시 우회 조건 (특정 쿠키나 헤더가 있으면 캐시 안 씀)
            proxy_cache_bypass $http_cache_control;

            # 같은 요청이 동시에 여러 개 오면, 하나만 백엔드에 보내고
            # 나머지는 캐시가 채워질 때까지 대기
            # 비유: "같은 책 복사를 10명이 동시에 요청하면,
            #        1부만 복사하고 나머지 9명은 기다림"
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;

            proxy_pass http://app:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ┌─────────────────────────────────────────────┐
        # │  정적 파일: 브라우저 캐싱                    │
        # └─────────────────────────────────────────────┘
        # 정적 파일(이미지, CSS, JS)은 브라우저에 캐시하게 합니다.
        # 비유: "이 사진은 1달 동안 바뀌지 않을 거니까,
        #        매번 서버에 물어보지 말고 저장해 둬"
        location /static/ {
            alias /var/www/static/;

            # expires: 브라우저 캐시 유효 기간 설정
            # 비유: 우유의 유통기한을 적는 것
            expires 30d;    # 30일 동안 브라우저 캐시 유지

            # Cache-Control 헤더 (더 세밀한 제어)
            # public: 프록시 서버도 캐시 가능
            # immutable: 파일이 절대 바뀌지 않음 (304 확인도 안 함)
            add_header Cache-Control "public, immutable";

            # 프록시 캐시도 적용
            proxy_cache static_cache;
            proxy_cache_valid 200 7d;

            # Gzip 압축 (CSS, JS는 압축 효과가 큼)
            gzip on;
        }

        # 자주 변하는 파일은 캐시하지 않음
        location /api/ {
            # no-cache: 매번 서버에 확인 (캐시는 하지만 사용 전 검증)
            # no-store: 아예 캐시하지 않음
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            expires -1;    # 즉시 만료

            proxy_pass http://app:8080;
        }

        # ┌─────────────────────────────────────────────┐
        # │  캐시 퍼지 (삭제) 엔드포인트                  │
        # └─────────────────────────────────────────────┘
        # 특정 URL의 캐시를 수동으로 삭제할 수 있습니다.
        # 비유: "이 책의 복사본이 오래됐으니 버리고 새로 복사해"
        # 주의: nginx-cache-purge 모듈이 필요합니다.
        # location /purge/ {
        #     allow 127.0.0.1;
        #     allow 10.0.0.0/8;
        #     deny all;
        #     proxy_cache_purge my_cache "$scheme$request_method$host$request_uri";
        # }
    }
}

# =============================================================================
# 캐시 관리 명령어:
# ─────────────────
# 캐시 디렉터리 확인:
#   ls -la /var/cache/nginx/
#
# 캐시 전체 삭제:
#   rm -rf /var/cache/nginx/*
#   nginx -s reload
#
# 캐시 상태 확인 (응답 헤더):
#   curl -I http://localhost/some-page
#   → X-Cache-Status: HIT   (캐시에서 응답)
#   → X-Cache-Status: MISS  (백엔드에서 응답)
#
# Gzip 압축 확인:
#   curl -H "Accept-Encoding: gzip" -I http://localhost/
#   → Content-Encoding: gzip  (압축됨)
# =============================================================================
