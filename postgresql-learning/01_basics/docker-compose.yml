# ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
# ■■■ PostgreSQL 16 + pgAdmin 4 학습 환경              ■■■
# ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
#
# 실행: docker-compose up -d
# 중지: docker-compose down -v
# 접속: psql -h localhost -U postgres -d study_db
# pgAdmin: http://localhost:5050
# ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■

version: "3.9"  # Docker Compose 버전

# ■■■ 서비스 정의 ■■■
services:

  # ─────────────────────────────────────────────
  # ■■■ PostgreSQL 16 데이터베이스 서버 ■■■
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine       # PostgreSQL 16 Alpine (경량 이미지, ~80MB)
    container_name: pg-study        # 컨테이너 이름
    restart: unless-stopped         # 비정상 종료 시 자동 재시작
    env_file:
      - .env                        # 환경 변수 파일에서 설정 로드
    environment:
      # POSTGRES_DB: 시작 시 자동 생성할 데이터베이스 이름
      POSTGRES_DB: ${POSTGRES_DB:-study_db}
      # POSTGRES_USER: 슈퍼유저 이름 (기본: postgres)
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # POSTGRES_PASSWORD: 슈퍼유저 비밀번호 (필수)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      # PGDATA: 데이터 디렉토리 경로 (볼륨 마운트 위치와 일치해야 함)
      PGDATA: /var/lib/postgresql/data/pgdata
      # TZ: 타임존 설정 (한국 표준시)
      TZ: Asia/Seoul
    ports:
      - "${POSTGRES_PORT:-5432}:5432"  # 호스트:컨테이너 포트 매핑
    volumes:
      # 데이터 영속성: 컨테이너 삭제 후에도 데이터 유지
      - pg_data:/var/lib/postgresql/data
      # 초기화 SQL: 컨테이너 첫 실행 시 자동 실행 (알파벳 순서)
      # /docker-entrypoint-initdb.d/ 디렉토리의 .sql, .sh 파일 자동 실행
      - ./init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      # pg_isready: PostgreSQL 서버 준비 상태 확인 유틸리티
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-study_db}"]
      interval: 10s       # 10초마다 체크
      timeout: 5s         # 5초 내 응답 없으면 실패
      retries: 5          # 5회 연속 실패 시 unhealthy
      start_period: 30s   # 시작 후 30초 동안은 실패 무시 (초기화 시간)
    networks:
      - pg_network
    # ■■■ 공유 메모리 크기 설정 ■■■
    # PostgreSQL은 공유 메모리를 많이 사용하므로 기본값(64MB)으로는 부족
    shm_size: '256mb'
    # ■■■ PostgreSQL 서버 설정 커맨드라인 옵션 ■■■
    command: >
      postgres
      -c shared_buffers=128MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c max_connections=100
      -c log_statement=all
      -c log_duration=on
      -c timezone=Asia/Seoul

  # ─────────────────────────────────────────────
  # ■■■ pgAdmin 4 (웹 기반 관리 도구) ■■■
  # ─────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest    # 최신 pgAdmin 4 이미지
    container_name: pgadmin-study   # 컨테이너 이름
    restart: unless-stopped
    environment:
      # pgAdmin 로그인 이메일 (관리자 계정)
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      # pgAdmin 로그인 비밀번호
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      # pgAdmin 설정 디렉토리
      PGADMIN_CONFIG_SERVER_MODE: "True"
    ports:
      - "${PGADMIN_PORT:-5050}:80"  # pgAdmin 웹 UI 포트
    volumes:
      # pgAdmin 설정 데이터 영속 저장
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy   # PostgreSQL이 healthy 상태일 때 시작
    networks:
      - pg_network

# ■■■ 볼륨 정의 ■■■
volumes:
  pg_data:          # PostgreSQL 데이터 볼륨
    driver: local
  pgadmin_data:     # pgAdmin 설정 볼륨
    driver: local

# ■■■ 네트워크 정의 ■■■
networks:
  pg_network:       # PostgreSQL 전용 네트워크
    driver: bridge
