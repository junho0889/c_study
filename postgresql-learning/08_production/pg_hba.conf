# ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
# ■■■ PostgreSQL 호스트 기반 인증 설정 (pg_hba.conf)   ■■■
# ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
#
# 형식: TYPE  DATABASE  USER  ADDRESS  METHOD
#
# TYPE:
#   local    - Unix 소켓 연결
#   host     - TCP/IP (SSL 무관)
#   hostssl  - SSL 필수 TCP/IP
#   hostnossl - SSL 없는 TCP/IP
#
# METHOD:
#   scram-sha-256 - 비밀번호 해시 인증 (권장!)
#   md5           - MD5 해시 인증 (레거시)
#   trust         - 무조건 허용 (개발용만!)
#   reject        - 무조건 거부
#   peer          - OS 사용자 이름 매칭 (local 전용)
#   cert          - SSL 클라이언트 인증서
#
# 규칙: 위에서 아래로 순서대로 매칭, 첫 번째 매칭 규칙 적용
# ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■

# ■■■ 로컬 연결 (Unix 소켓) ■■■
# 같은 서버에서 접속 시 (docker exec 등)
local   all         postgres                        trust
local   all         all                             scram-sha-256

# ■■■ IPv4 로컬호스트 ■■■
host    all         postgres    127.0.0.1/32        scram-sha-256
host    all         all         127.0.0.1/32        scram-sha-256

# ■■■ IPv6 로컬호스트 ■■■
host    all         postgres    ::1/128             scram-sha-256
host    all         all         ::1/128             scram-sha-256

# ■■■ Docker 내부 네트워크 ■■■
# 172.16.0.0/12: Docker 기본 네트워크 대역
host    all         all         172.16.0.0/12       scram-sha-256

# ■■■ 복제 연결 허용 ■■■
# replicator 사용자만 복제 가능
host    replication replicator  172.16.0.0/12       scram-sha-256

# ■■■ 앱 서비스 연결 (특정 DB만) ■■■
# app_service 사용자는 study_db만 접근 가능
host    study_db    app_service 172.16.0.0/12       scram-sha-256

# ■■■ 외부 접속 (SSL 필수) ■■■
# 프로덕션에서는 hostssl로 변경하여 SSL 강제
host    all         all         0.0.0.0/0           scram-sha-256

# ■■■ 나머지 모든 연결 거부 ■■■
# (위 규칙에 매칭되지 않는 모든 연결)
# host    all         all         0.0.0.0/0           reject
