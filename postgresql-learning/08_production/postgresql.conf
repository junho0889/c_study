# ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
# ■■■ PostgreSQL 프로덕션 설정 (postgresql.conf)       ■■■
# ■■■ 서버 사양: 4 CPU, 8GB RAM, SSD 기준              ■■■
# ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■

# ─────────────────────────────────────────────
# ■■■ 연결 설정 ■■■
# ─────────────────────────────────────────────

# max_connections: 최대 동시 연결 수
#   PgBouncer 사용 시 낮게 설정 가능 (풀링으로 커버)
#   각 연결은 약 5~10MB 메모리 사용
max_connections = 100

# superuser_reserved_connections: 슈퍼유저 전용 예약 연결
#   max_connections 초과 시에도 슈퍼유저는 접속 가능 (긴급 대응용)
superuser_reserved_connections = 3

# listen_addresses: 수신 대기할 IP 주소
#   '*': 모든 인터페이스 (Docker에서는 필수)
#   'localhost': 로컬만 (프로덕션 비-Docker 환경)
listen_addresses = '*'

# port: 수신 포트
port = 5432

# ─────────────────────────────────────────────
# ■■■ 메모리 설정 (가장 중요!) ■■■
# ─────────────────────────────────────────────

# shared_buffers: PostgreSQL이 데이터 캐싱에 사용하는 공유 메모리
#   권장: 전체 RAM의 25% (8GB RAM → 2GB)
#   너무 크면 OS 캐시와 경합 발생
shared_buffers = 2GB

# work_mem: 정렬, 해시 작업에 사용하는 메모리 (연결당, 작업당)
#   총 사용량 = work_mem × max_connections × 동시 작업 수
#   권장: RAM / (max_connections × 2~4)
#   주의: 너무 크면 OOM 발생 가능
work_mem = 16MB

# maintenance_work_mem: VACUUM, CREATE INDEX 등 유지보수 작업 메모리
#   권장: RAM의 5~10% (1회에 하나만 실행되므로 넉넉하게)
maintenance_work_mem = 512MB

# effective_cache_size: OS가 파일 캐시에 사용 가능한 메모리 추정값
#   실제 메모리를 할당하지 않음! 쿼리 플래너의 참고값
#   권장: 전체 RAM의 50~75%
effective_cache_size = 6GB

# huge_pages: 대규모 페이지 사용 (Linux만)
#   try: 사용 가능하면 사용 (권장)
#   on: 반드시 사용 (불가 시 에러)
#   off: 사용 안 함
huge_pages = try

# temp_buffers: 임시 테이블용 버퍼
temp_buffers = 32MB

# ─────────────────────────────────────────────
# ■■■ WAL (Write-Ahead Logging) 설정 ■■■
# ─────────────────────────────────────────────

# wal_level: WAL 기록 레벨
#   minimal: 기본 복구만 (복제 불가)
#   replica: 스트리밍 복제 지원 (프로덕션 권장)
#   logical: 논리 복제 지원
wal_level = replica

# max_wal_size: 체크포인트 사이 최대 WAL 크기
#   체크포인트 빈도 결정 (클수록 체크포인트 빈도 낮아짐)
max_wal_size = 4GB

# min_wal_size: WAL 최소 유지 크기
min_wal_size = 1GB

# wal_buffers: WAL 쓰기 버퍼 크기
#   -1: shared_buffers의 1/32로 자동 설정 (최대 64MB)
wal_buffers = 64MB

# checkpoint_completion_target: 체크포인트 완료 목표 비율
#   0.9: 다음 체크포인트까지 시간의 90%에 걸쳐 분산 기록
#   I/O 스파이크 방지
checkpoint_completion_target = 0.9

# checkpoint_timeout: 체크포인트 최대 간격
checkpoint_timeout = 15min

# ─────────────────────────────────────────────
# ■■■ 쿼리 플래너 설정 ■■■
# ─────────────────────────────────────────────

# random_page_cost: 랜덤 I/O 비용 (SSD는 낮게)
#   HDD: 4.0 (기본값)
#   SSD: 1.1~1.5 (순차/랜덤 I/O 차이 적음)
random_page_cost = 1.1

# seq_page_cost: 순차 I/O 비용
seq_page_cost = 1.0

# effective_io_concurrency: 동시 I/O 작업 수
#   SSD: 200 (병렬 I/O 활용)
#   HDD: 2~4
effective_io_concurrency = 200

# ─────────────────────────────────────────────
# ■■■ 병렬 쿼리 설정 ■■■
# ─────────────────────────────────────────────

# max_worker_processes: 시스템 전체 워커 프로세스 수
max_worker_processes = 8

# max_parallel_workers_per_gather: Gather 노드당 병렬 워커 수
max_parallel_workers_per_gather = 2

# max_parallel_workers: 전체 병렬 워커 수
max_parallel_workers = 4

# max_parallel_maintenance_workers: 유지보수 병렬 워커 (CREATE INDEX 등)
max_parallel_maintenance_workers = 2

# parallel_tuple_cost: 병렬 처리 튜플 전달 비용
parallel_tuple_cost = 0.01

# parallel_setup_cost: 병렬 처리 시작 비용
parallel_setup_cost = 1000

# min_parallel_table_scan_size: 병렬 스캔 최소 테이블 크기
min_parallel_table_scan_size = 8MB

# ─────────────────────────────────────────────
# ■■■ VACUUM (자동 정리) 설정 ■■■
# ─────────────────────────────────────────────

# autovacuum: 자동 VACUUM 활성화 (반드시 on!)
autovacuum = on

# autovacuum_max_workers: 동시 실행 가능한 autovacuum 워커 수
autovacuum_max_workers = 3

# autovacuum_vacuum_threshold: VACUUM 실행 최소 죽은 행 수
autovacuum_vacuum_threshold = 50

# autovacuum_analyze_threshold: ANALYZE 실행 최소 변경 행 수
autovacuum_analyze_threshold = 50

# autovacuum_vacuum_scale_factor: VACUUM 실행 비율 (테이블 크기의 %)
#   0.1 = 10% 이상 행이 변경되면 VACUUM
#   큰 테이블에서는 더 낮게 설정 (0.01~0.05)
autovacuum_vacuum_scale_factor = 0.05

# autovacuum_analyze_scale_factor: ANALYZE 실행 비율
autovacuum_analyze_scale_factor = 0.05

# autovacuum_vacuum_cost_limit: autovacuum I/O 비용 제한
#   높을수록 빠르지만 서비스 영향 ↑
autovacuum_vacuum_cost_limit = 1000

# ─────────────────────────────────────────────
# ■■■ 로깅 설정 ■■■
# ─────────────────────────────────────────────

# log_destination: 로그 출력 대상
log_destination = 'stderr'

# logging_collector: 로그 수집기 활성화
logging_collector = on

# log_directory: 로그 파일 디렉토리
log_directory = 'log'

# log_filename: 로그 파일 이름 패턴
log_filename = 'postgresql-%Y-%m-%d.log'

# log_rotation_age: 로그 파일 로테이션 간격
log_rotation_age = 1d

# log_rotation_size: 로그 파일 최대 크기
log_rotation_size = 100MB

# log_min_duration_statement: 이 시간 이상 걸리는 쿼리만 로깅 (ms)
#   -1: 비활성화
#   0: 모든 쿼리 로깅 (개발용)
#   1000: 1초 이상 걸리는 쿼리만 (프로덕션 권장)
log_min_duration_statement = 1000

# log_checkpoints: 체크포인트 로깅
log_checkpoints = on

# log_connections: 연결 로깅
log_connections = on

# log_disconnections: 연결 해제 로깅
log_disconnections = on

# log_lock_waits: 잠금 대기 로깅 (deadlock_timeout 이상 대기 시)
log_lock_waits = on

# log_temp_files: 임시 파일 사용 로깅 (KB)
#   0: 모든 임시 파일 로깅
log_temp_files = 0

# log_autovacuum_min_duration: autovacuum 로깅 최소 시간 (ms)
log_autovacuum_min_duration = 0

# log_line_prefix: 로그 라인 접두사
#   %t: 타임스탬프, %u: 사용자, %d: 데이터베이스, %p: PID
log_line_prefix = '%t [%p] %u@%d '

# ─────────────────────────────────────────────
# ■■■ 타임존 ■■■
# ─────────────────────────────────────────────
timezone = 'Asia/Seoul'
log_timezone = 'Asia/Seoul'

# ─────────────────────────────────────────────
# ■■■ 통계 수집 ■■■
# ─────────────────────────────────────────────

# track_activities: 활성 쿼리 추적 (pg_stat_activity)
track_activities = on

# track_counts: 테이블/인덱스 통계 추적 (autovacuum에 필요!)
track_counts = on

# track_io_timing: I/O 타이밍 추적 (EXPLAIN ANALYZE에서 I/O 시간 표시)
track_io_timing = on

# track_functions: 함수 호출 통계 추적
track_functions = all

# ─────────────────────────────────────────────
# ■■■ 잠금 설정 ■■■
# ─────────────────────────────────────────────

# deadlock_timeout: 데드락 감지 대기 시간
deadlock_timeout = 1s

# lock_timeout: 잠금 획득 최대 대기 시간 (0 = 무제한)
lock_timeout = 0

# statement_timeout: 쿼리 최대 실행 시간 (0 = 무제한)
#   프로덕션에서는 적절한 타임아웃 설정 권장
statement_timeout = 0

# idle_in_transaction_session_timeout: 유휴 트랜잭션 타임아웃
#   열린 트랜잭션을 방치하면 잠금, 블로트 유발
idle_in_transaction_session_timeout = 300000    # 5분 (300초 × 1000ms)
