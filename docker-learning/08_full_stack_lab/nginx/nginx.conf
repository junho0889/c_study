# ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
# ■ 파일명: nginx.conf
# ■ 목적: Nginx 리버스 프록시 + 정적 파일 서빙 설정
# ■ 설명: 프론트엔드(/)와 API(/api/)를 하나의 도메인으로 제공
# ■ 날짜: 2026-03-21
# ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■

# ── upstream: 백엔드 서버 그룹 정의 ──
# 여러 API 서버가 있을 때 로드 밸런싱에 사용해
# 지금은 1대지만, 나중에 여러 대로 확장할 수 있어
upstream api_backend {
    # Docker Compose 서비스 이름으로 접근
    # "api"가 DNS로 자동 해석돼
    server api:8000;                         # Python API 서버

    # 여러 대일 때 (로드 밸런싱):
    # server api-1:8000 weight=3;            # 가중치 3 (요청 3배 더 받음)
    # server api-2:8000 weight=1;            # 가중치 1
    # server api-3:8000 backup;              # 백업 (위 서버 다운 시만 사용)
}

# ── 서버 블록 ──
server {
    # ── 포트 설정 ──
    listen 80;                               # HTTP 80번 포트에서 수신
    server_name localhost;                   # 서버 이름 (도메인)

    # ── 로그 설정 ──
    access_log /var/log/nginx/access.log;    # 접근 로그 경로
    error_log /var/log/nginx/error.log warn; # 에러 로그 (warn 이상만)

    # ── gzip 압축 ──
    # 응답을 압축해서 전송 → 네트워크 대역폭 절약!
    gzip on;                                 # gzip 압축 활성화
    gzip_types                               # 압축할 파일 종류
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml;
    gzip_min_length 256;                     # 256바이트 이상만 압축

    # ══════════════════════════════════════════
    # 정적 파일 서빙 (프론트엔드)
    # ══════════════════════════════════════════
    # / → /usr/share/nginx/html에서 파일 제공
    location / {
        root /usr/share/nginx/html;          # 정적 파일 경로
        index index.html;                    # 기본 파일
        try_files $uri $uri/ /index.html;    # SPA 라우팅 지원
        # try_files 설명:
        # 1. 요청한 파일이 있으면 → 그 파일 제공
        # 2. 디렉토리면 → 디렉토리 안의 index.html
        # 3. 둘 다 없으면 → /index.html (React Router가 처리)

        # ── 정적 파일 캐싱 ──
        # 브라우저가 파일을 캐싱하면 다시 다운로드 안 해 → 빨라!
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 30d;                     # 30일간 캐싱
            add_header Cache-Control "public, immutable";
        }
    }

    # ══════════════════════════════════════════
    # API 리버스 프록시
    # ══════════════════════════════════════════
    # /api/ → Python API 서버로 전달
    location /api/ {
        proxy_pass http://api_backend/;      # upstream으로 전달

        # ── 프록시 헤더 설정 ──
        # 원래 요청 정보를 API 서버에 전달해줘야 해
        proxy_set_header Host $host;                          # 원래 호스트 이름
        proxy_set_header X-Real-IP $remote_addr;              # 클라이언트 실제 IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # 프록시 체인 IP
        proxy_set_header X-Forwarded-Proto $scheme;           # HTTP/HTTPS 구분

        # ── 타임아웃 설정 ──
        proxy_connect_timeout 30s;           # 연결 타임아웃
        proxy_send_timeout 30s;              # 전송 타임아웃
        proxy_read_timeout 60s;              # 응답 대기 타임아웃

        # ── 버퍼 설정 ──
        proxy_buffering on;                  # 응답 버퍼링 활성화
        proxy_buffer_size 4k;                # 헤더 버퍼 크기
        proxy_buffers 8 4k;                  # 본문 버퍼 (8개 x 4KB)
    }

    # ══════════════════════════════════════════
    # 헬스체크 엔드포인트
    # ══════════════════════════════════════════
    # Nginx 자체가 살아있는지 확인하는 엔드포인트
    location /health {
        access_log off;                      # 헬스체크 로그 안 남김 (너무 많으니까)
        return 200 '{"status": "healthy"}';  # 항상 200 OK 반환
        add_header Content-Type application/json;
    }

    # ══════════════════════════════════════════
    # Prometheus 메트릭 프록시
    # ══════════════════════════════════════════
    location /metrics {
        proxy_pass http://api_backend/metrics;
        # 내부에서만 접근 가능하게 제한하고 싶으면:
        # allow 172.0.0.0/8;                 # Docker 내부 IP만 허용
        # deny all;                          # 나머지 거부
    }

    # ══════════════════════════════════════════
    # 에러 페이지
    # ══════════════════════════════════════════
    error_page 404 /index.html;              # 404 → SPA가 처리
    error_page 500 502 503 504 /50x.html;    # 서버 에러 페이지
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
