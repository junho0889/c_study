# ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
# ■ 파일명: docker-compose.yml
# ■ 목적: 풀스택 실습 환경 - 완전한 웹 애플리케이션 아키텍처
# ■ 구성: React + Python API + PostgreSQL + Redis + Nginx + Prometheus
# ■ 실행: docker-compose up -d
# ■ 접속: http://localhost (Nginx → React/API)
# ■ 날짜: 2026-03-21
# ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■

# ── 전체 아키텍처 구성도 ──
#
#                    ┌───────────────────────┐
#                    │      사용자 브라우저     │
#                    └───────────┬───────────┘
#                                │
#                         포트 80 (HTTP)
#                                │
#                    ┌───────────▼───────────┐
#                    │     Nginx (포트 80)     │
#                    │   리버스 프록시 + 정적 파일│
#                    │                       │
#                    │  /      → frontend     │
#                    │  /api/  → api:8000     │
#                    └──┬──────────────┬─────┘
#                       │              │
#            정적 파일 서빙│      API 프록시│
#                       │              │
#          ┌────────────▼───┐  ┌──────▼─────────┐
#          │  Frontend       │  │  Python API     │
#          │  (React/HTML)   │  │  (Flask:8000)   │
#          │  정적 파일만     │  │                 │
#          └────────────────┘  └──┬──────────┬───┘
#                                 │          │
#                      DB 쿼리    │  캐시 조회 │
#                                 │          │
#                    ┌────────────▼──┐  ┌───▼──────────┐
#                    │  PostgreSQL    │  │    Redis      │
#                    │  (포트 5432)   │  │  (포트 6379)   │
#                    │  영구 데이터   │  │  캐시 + 세션   │
#                    └───────────────┘  └──────────────┘
#                                │
#                    ┌───────────▼───────────┐
#                    │    Prometheus (9090)   │
#                    │    메트릭 수집 + 저장    │
#                    └───────────────────────┘

services:

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 서비스 1: Nginx - 리버스 프록시 & 정적 파일 서빙
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 역할:
  # 1. 사용자의 모든 요청을 받는 관문 (진입점)
  # 2. / → 프론트엔드 정적 파일 제공
  # 3. /api/ → 백엔드 API로 전달 (리버스 프록시)
  # 4. SSL/TLS 처리 (HTTPS)
  nginx:
    image: nginx:1.27-alpine                 # Nginx 경량 이미지
    container_name: fullstack-nginx          # 컨테이너 이름
    ports:
      - "80:80"                              # HTTP 포트 (브라우저 접속용)
      - "443:443"                            # HTTPS 포트 (SSL 사용 시)
    volumes:
      # Nginx 설정 파일 (리버스 프록시 규칙 정의)
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 프론트엔드 정적 파일 (HTML, CSS, JS)
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy           # API가 준비된 후 시작
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"                      # 로그 용량 제한
        max-file: "3"
    networks:
      - frontend                             # 프론트엔드 네트워크

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 서비스 2: Python API - 백엔드 비즈니스 로직
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 역할:
  # 1. REST API 제공 (/api/*)
  # 2. PostgreSQL에서 데이터 조회/저장
  # 3. Redis에서 캐시 관리
  # 4. Prometheus 메트릭 제공 (/metrics)
  api:
    build:
      context: ./api                         # api/ 디렉토리에서 빌드
      dockerfile: Dockerfile                 # Dockerfile 사용
    image: fullstack-api:latest              # 빌드된 이미지 이름
    container_name: fullstack-api            # 컨테이너 이름
    # ── 환경변수: .env 파일과 직접 지정 혼합 ──
    env_file:
      - .env                                 # 공통 환경변수 로드
    environment:
      # DB 연결 정보 (.env의 변수 참조)
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres123}@db:5432/${DB_NAME:-fullstack}
      # Redis 연결 정보
      - REDIS_URL=redis://redis:6379/0
      # 앱 설정
      - APP_ENV=${APP_ENV:-development}
      - APP_PORT=8000
      - APP_SECRET_KEY=${APP_SECRET_KEY:-my-secret-key}
      # Prometheus 메트릭 활성화
      - METRICS_ENABLED=true
    expose:
      - "8000"                               # 내부적으로만 8000 포트 공개
    volumes:
      # 개발 시 소스코드 실시간 반영
      - ./api:/app                           # API 소스코드 마운트
    depends_on:
      db:
        condition: service_healthy           # DB 준비 대기
      redis:
        condition: service_healthy           # Redis 준비 대기
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s                      # 패키지 설치 시간 대기
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'                        # CPU 1코어 제한
          memory: 512M                       # 메모리 512MB 제한
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - frontend                             # Nginx와 통신
      - backend                              # DB/Redis와 통신

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 서비스 3: PostgreSQL - 관계형 데이터베이스
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 역할:
  # 1. 사용자 데이터, 게시물 등 영구 데이터 저장
  # 2. ACID 트랜잭션 보장
  # 3. SQL 쿼리로 데이터 조회
  db:
    image: postgres:16-alpine                # PostgreSQL 16 경량 이미지
    container_name: fullstack-db             # 컨테이너 이름
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}   # DB 사용자명
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres123}  # DB 비밀번호
      - POSTGRES_DB=${DB_NAME:-fullstack}    # 기본 데이터베이스 이름
      - PGDATA=/var/lib/postgresql/data/pgdata  # 데이터 저장 경로
    volumes:
      # DB 데이터 영구 보존 (가장 중요한 볼륨!)
      - db-data:/var/lib/postgresql/data     # 데이터 볼륨
      # 초기화 SQL (첫 실행 시 테이블 자동 생성)
      - ./api/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-fullstack}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G                         # DB는 메모리가 중요해
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend                              # 백엔드 네트워크만
    # 보안: DB 포트를 외부에 공개하지 않음!

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 서비스 4: Redis - 인메모리 캐시 & 세션 저장소
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 역할:
  # 1. API 응답 캐싱 (DB 부하 감소)
  # 2. 사용자 세션 관리
  # 3. 실시간 카운터 (방문자 수 등)
  redis:
    image: redis:7-alpine                    # Redis 7 경량 이미지
    container_name: fullstack-redis          # 컨테이너 이름
    command: >
      redis-server
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    # --maxmemory 128mb: 최대 메모리 128MB
    # --maxmemory-policy allkeys-lru: 가득 차면 오래된 것 삭제
    # --appendonly yes: 디스크에 데이터 기록 (재시작 시 복원)
    volumes:
      - redis-data:/data                     # Redis 데이터 영구 보존
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    networks:
      - backend

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 서비스 5: Prometheus - 메트릭 수집 & 모니터링
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 역할:
  # 1. API의 /metrics 엔드포인트에서 메트릭 수집
  # 2. 시계열 데이터 저장
  # 3. 알림 규칙 평가
  prometheus:
    image: prom/prometheus:v2.54.1           # Prometheus 공식 이미지
    container_name: fullstack-prometheus     # 컨테이너 이름
    ports:
      - "9090:9090"                          # Prometheus 웹 UI
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus          # 메트릭 데이터 저장
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'   # 7일간 데이터 보존
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend                              # API 메트릭 수집
      - frontend                             # 웹 UI 접근

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# volumes: 데이터 영구 저장소
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
volumes:
  db-data:                                   # PostgreSQL 데이터
    driver: local
    name: fullstack-db-data                  # 식별 가능한 이름
  redis-data:                                # Redis 데이터
    driver: local
    name: fullstack-redis-data
  prometheus-data:                           # Prometheus 메트릭
    driver: local
    name: fullstack-prometheus-data

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# networks: 네트워크 분리 (보안)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# frontend: Nginx ↔ API, Prometheus UI
# backend: API ↔ DB, Redis, Prometheus
# Nginx는 DB/Redis에 직접 접근 불가! (보안!)
networks:
  frontend:
    driver: bridge
    name: fullstack-frontend
  backend:
    driver: bridge
    name: fullstack-backend
