# ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
# ■ 파일명: docker-compose.yml
# ■ 목적: Docker Compose 심화 - 멀티 서비스 아키텍처
# ■ 구성: Python 웹 + PostgreSQL + Redis + Nginx
# ■ 실행: docker-compose up -d
# ■ 날짜: 2026-03-21
# ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■

# ── 아키텍처 구성도 ──
#
#  [사용자 브라우저]
#        │
#        ▼ (포트 80)
#  ┌──────────┐
#  │  Nginx   │  ← 리버스 프록시 (문지기 역할)
#  └────┬─────┘
#       │ (포트 8000)
#  ┌────▼─────┐
#  │ Python   │  ← 웹 애플리케이션 (일꾼 역할)
#  │ Web App  │
#  └──┬───┬───┘
#     │   │
#     │   │ (포트 6379)
#     │  ┌▼────────┐
#     │  │  Redis   │  ← 캐시 저장소 (빠른 메모장)
#     │  └─────────┘
#     │ (포트 5432)
#  ┌──▼──────────┐
#  │ PostgreSQL  │  ← 데이터베이스 (영구 기록장)
#  └─────────────┘

services:

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 서비스 1: Nginx 리버스 프록시
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 리버스 프록시란? 사용자의 요청을 받아서 뒤에 있는 앱에 전달하는 중간다리
  # 왜 필요할까?
  # 1. 여러 앱 서버로 요청을 나눠줄 수 있어 (로드 밸런싱)
  # 2. SSL(HTTPS) 처리를 여기서 해
  # 3. 정적 파일(이미지, CSS)을 직접 제공해서 앱 서버 부담을 줄여
  nginx:
    image: nginx:1.27-alpine                # Nginx 1.27 Alpine 버전 (작고 빠름)
    container_name: compose-nginx            # 컨테이너 이름 고정
    ports:
      - "${NGINX_PORT:-80}:80"               # .env의 NGINX_PORT 사용, 없으면 80
    volumes:
      # nginx.conf를 호스트에서 직접 수정할 수 있게 바인드 마운트
      # :ro = read-only (읽기 전용 - 컨테이너가 이 파일을 수정 못 해)
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:                              # 의존성 순서 정의
      web:
        condition: service_healthy           # web이 healthy가 될 때까지 기다려
    restart: unless-stopped                  # 수동 정지 외에는 항상 재시작
    networks:
      - frontend                             # 프론트엔드 네트워크에만 연결
    # ── logging: 로그 설정 ──
    # 로그 파일이 너무 커지면 디스크가 가득 찰 수 있어
    # max-size: 한 파일 최대 크기
    # max-file: 파일 최대 개수 (3개가 넘으면 오래된 것부터 삭제)
    logging:
      driver: json-file                      # JSON 형식으로 로그 저장
      options:
        max-size: "10m"                      # 파일당 최대 10MB
        max-file: "3"                        # 최대 3개 파일 유지

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 서비스 2: Python 웹 애플리케이션
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  web:
    image: python:3.12-slim                  # Python 3.12 경량 이미지
    container_name: compose-web              # 컨테이너 이름
    # ── command: 컨테이너 시작 시 실행할 명령어 ──
    # 이미지의 기본 CMD를 덮어써
    # pip install로 필요한 패키지 설치 후 앱 실행
    command: >
      bash -c "
        pip install flask psycopg2-binary redis requests &&
        python /app/app.py
      "
    # ── environment: 환경변수 (.env 파일에서 읽어옴) ──
    # ${변수명} 형태로 .env 파일의 값을 참조해
    # ${변수명:-기본값} → .env에 없으면 기본값 사용
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-secret}@db:5432/${DB_NAME:-myapp}
      - REDIS_URL=redis://redis:6379/0       # Redis 연결 URL
      - APP_ENV=${APP_ENV:-development}       # 앱 실행 환경
      - APP_SECRET_KEY=${APP_SECRET_KEY:-change-me-in-production}
      - APP_PORT=8000                         # 앱 포트
    volumes:
      # ── 바인드 마운트: 호스트 디렉토리를 컨테이너에 연결 ──
      # ./app:/app → 현재 디렉토리의 app 폴더를 컨테이너의 /app에 연결
      # 파일을 수정하면 컨테이너에 즉시 반영돼 (개발 시 유용!)
      - ./app:/app                            # 소스코드 마운트
    expose:
      # ── expose vs ports 차이 ──
      # expose: 같은 네트워크의 다른 컨테이너에게만 포트 공개
      # ports: 호스트(내 컴퓨터)에도 포트 공개
      # 웹 앱은 Nginx를 통해서만 접근하니까 expose만 써
      - "8000"                                # 내부적으로만 8000 포트 공개
    depends_on:
      db:
        condition: service_healthy            # DB가 준비될 때까지 기다려
      redis:
        condition: service_healthy            # Redis가 준비될 때까지 기다려
    # ── healthcheck: 앱 상태 확인 ──
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s                           # 15초마다 확인
      timeout: 5s                             # 5초 안에 응답해야 함
      retries: 3                              # 3번 실패하면 unhealthy
      start_period: 30s                       # 시작 후 30초 대기 (패키지 설치 시간)
    restart: on-failure                       # 오류로 종료될 때만 재시작
    networks:
      - frontend                              # Nginx와 통신
      - backend                               # DB, Redis와 통신
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"                         # 웹 앱은 로그가 많으니 5개까지

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 서비스 3: PostgreSQL 데이터베이스
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  db:
    image: postgres:16-alpine                 # PostgreSQL 16 Alpine 버전
    container_name: compose-db                # 컨테이너 이름
    # ── env_file: 환경변수 파일 지정 ──
    # environment와 비슷하지만 파일에서 읽어오는 방식
    # .env 파일의 변수를 자동으로 읽어
    env_file:
      - .env                                  # .env 파일에서 환경변수 읽기
    environment:
      # PostgreSQL 이미지가 사용하는 특별한 환경변수들
      - POSTGRES_USER=${DB_USER:-postgres}    # DB 사용자 이름
      - POSTGRES_PASSWORD=${DB_PASSWORD:-secret}  # DB 비밀번호
      - POSTGRES_DB=${DB_NAME:-myapp}         # 생성할 데이터베이스 이름
      - PGDATA=/var/lib/postgresql/data/pgdata  # 데이터 저장 경로
    volumes:
      # ── Named Volume: 이름이 있는 볼륨 ──
      # 컨테이너가 삭제되어도 데이터가 보존돼
      # DB 데이터는 반드시 볼륨에 저장해야 해!
      - postgres-data:/var/lib/postgresql/data  # DB 데이터 영구 보존
      # 초기화 SQL 스크립트 (컨테이너 첫 실행 시 자동 실행)
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # pg_isready = PostgreSQL이 연결을 받을 준비가 됐는지 확인
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-myapp}"]
      interval: 10s                           # 10초마다 확인
      timeout: 5s                             # 5초 타임아웃
      retries: 5                              # 5번 재시도 (DB는 시작이 느릴 수 있어)
      start_period: 10s                       # 10초 초기 대기
    restart: unless-stopped
    networks:
      - backend                               # 백엔드 네트워크에만 연결
    # ── 포트를 외부에 공개하지 않음 ──
    # DB는 보안상 외부에서 직접 접근하면 안 돼
    # 같은 네트워크의 web 서비스만 접근 가능

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 서비스 4: Redis 캐시
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  redis:
    image: redis:7-alpine                     # Redis 7 Alpine 버전
    container_name: compose-redis             # 컨테이너 이름
    # ── command: Redis 설정 옵션 ──
    # redis-server에 옵션을 전달해
    command: >
      redis-server
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    # --maxmemory: 최대 메모리 사용량 제한
    # --maxmemory-policy allkeys-lru: 메모리가 가득 차면 가장 오래 안 쓴 것 삭제
    # --appendonly yes: 데이터를 디스크에 기록 (재시작해도 데이터 보존)
    # --appendfsync everysec: 1초마다 디스크에 기록
    volumes:
      - redis-data:/data                      # Redis 데이터 영구 보존
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]      # PONG이 오면 정상
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - backend                               # 백엔드 네트워크에만 연결

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# volumes: 데이터 영구 저장소 정의
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
volumes:
  postgres-data:                              # PostgreSQL 데이터
    driver: local                             # 로컬 디스크 드라이버
    name: compose-deep-postgres-data          # 볼륨 이름을 명시적으로 지정
  redis-data:                                 # Redis 데이터
    driver: local
    name: compose-deep-redis-data

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# networks: 네트워크 분리
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 왜 네트워크를 나눌까?
# → 보안! Nginx가 DB에 직접 접근할 필요가 없으니까
# → frontend: Nginx ↔ Web 통신용
# → backend: Web ↔ DB/Redis 통신용
networks:
  frontend:                                   # 프론트엔드 네트워크
    driver: bridge                            # bridge 드라이버 사용
    name: compose-deep-frontend               # 네트워크 이름 명시
  backend:                                    # 백엔드 네트워크
    driver: bridge
    name: compose-deep-backend
    # internal: true                          # true로 설정하면 외부 인터넷 접근 차단
