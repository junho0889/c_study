# ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
# ■ 파일명: docker-compose.yml
# ■ 목적: 볼륨과 네트워크 완벽 실습
# ■ 설명: Named volumes, bind mounts, tmpfs, 네트워크 종류별 실습
# ■ 실행: docker-compose up -d
# ■ 날짜: 2026-03-21
# ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■

# ── 볼륨 3가지 종류 ──
#
# 1. Named Volume (이름 있는 볼륨)
#    → Docker가 관리하는 저장소. 컨테이너 삭제해도 데이터 남아있어
#    → 데이터베이스 데이터 저장에 최적!
#    → 형태: volume_name:/container/path
#
# 2. Bind Mount (바인드 마운트)
#    → 호스트의 디렉토리를 컨테이너에 직접 연결
#    → 개발 시 소스코드 실시간 반영에 최적!
#    → 형태: ./host/path:/container/path
#
# 3. tmpfs Mount
#    → 메모리(RAM)에만 저장, 컨테이너 종료 시 사라져
#    → 비밀번호 같은 민감한 임시 데이터에 사용
#    → 형태: tmpfs 지정

services:

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 서비스 1: 볼륨 종류별 데모
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  volume-demo:
    image: nginx:1.27-alpine              # Nginx 웹서버
    container_name: volume-demo            # 컨테이너 이름
    ports:
      - "8080:80"                          # 호스트 8080 → 컨테이너 80
    volumes:
      # ── 1. Named Volume (이름 있는 볼륨) ──
      # Docker가 /var/lib/docker/volumes/에 데이터를 저장해
      # 컨테이너를 삭제하고 다시 만들어도 데이터가 그대로야!
      # 데이터베이스 파일 같은 중요한 데이터에 사용해
      - nginx-data:/usr/share/nginx/html   # 웹 페이지 파일을 볼륨에 저장

      # ── 2. Bind Mount (바인드 마운트) ──
      # 호스트의 파일/폴더를 컨테이너에 직접 연결해
      # 호스트에서 파일을 수정하면 컨테이너에 즉시 반영돼!
      # 개발할 때 소스코드를 실시간으로 바꿀 수 있어서 편해
      # :ro = read-only (읽기 전용 - 컨테이너가 수정 못 함)
      - ./custom-nginx.conf:/etc/nginx/conf.d/default.conf:ro

      # ── 3. Bind Mount (로그 저장) ──
      # 로그 파일을 호스트에 저장하면 컨테이너가 삭제되어도 볼 수 있어
      - ./logs:/var/log/nginx              # Nginx 로그를 호스트에 저장
    # ── tmpfs Mount ──
    # 메모리(RAM)에만 데이터 저장
    # 컨테이너가 종료되면 데이터가 완전히 사라져
    # 비밀번호, 토큰 같은 민감한 임시 데이터에 사용
    tmpfs:
      - /tmp:size=64m                      # /tmp를 RAM에 저장 (최대 64MB)
      - /run:size=32m                      # /run도 RAM에 저장 (최대 32MB)
    networks:
      - frontend                           # 프론트엔드 네트워크

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 서비스 2: DB (Named Volume 데모)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  db:
    image: postgres:16-alpine              # PostgreSQL 16
    container_name: volume-db              # 컨테이너 이름
    environment:
      - POSTGRES_USER=admin                # DB 사용자
      - POSTGRES_PASSWORD=password123      # DB 비밀번호
      - POSTGRES_DB=volumetest             # DB 이름
    volumes:
      # ── Named Volume으로 DB 데이터 보존 ──
      # 이게 없으면 컨테이너 삭제 시 모든 데이터가 사라져!
      # DB는 반드시 볼륨을 사용해야 해
      - db-data:/var/lib/postgresql/data    # DB 데이터 영구 보존

      # ── 초기화 스크립트 바인드 마운트 ──
      # docker-entrypoint-initdb.d에 SQL 파일을 넣으면
      # 컨테이너 처음 시작할 때 자동으로 실행돼
      - ./init:/docker-entrypoint-initdb.d:ro  # 초기화 SQL 스크립트
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend                            # 백엔드 네트워크만

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 서비스 3: Redis (Named Volume 데모)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  redis:
    image: redis:7-alpine                  # Redis 7
    container_name: volume-redis           # 컨테이너 이름
    command: redis-server --appendonly yes  # AOF 모드로 데이터 영속화
    volumes:
      - redis-data:/data                   # Redis 데이터 영구 보존
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - backend                            # 백엔드 네트워크만

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 서비스 4: 앱 (Bind Mount 개발 데모)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  app:
    image: python:3.12-slim                # Python 3.12
    container_name: volume-app             # 컨테이너 이름
    command: >
      bash -c "
        pip install flask redis psycopg2-binary &&
        python /app/app.py
      "
    volumes:
      # ── Bind Mount: 소스코드 실시간 반영 ──
      # 호스트에서 app.py를 수정하면 컨테이너에 바로 반영돼
      # 개발할 때 이미지를 다시 빌드하지 않아도 돼서 편해!
      - ./app:/app                         # 소스코드 마운트

      # ── Named Volume: 앱 데이터 저장 ──
      - app-uploads:/app/uploads           # 업로드 파일 보존
    tmpfs:
      - /app/tmp:size=32m                  # 임시 파일은 메모리에
    ports:
      - "5000:5000"                        # 호스트 5000 → 컨테이너 5000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - frontend                           # Nginx와 통신
      - backend                            # DB, Redis와 통신

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 서비스 5: DNS 테스트용
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Docker DNS가 어떻게 작동하는지 테스트하는 컨테이너
  dns-tester:
    image: alpine:3.20                     # 가장 작은 리눅스
    container_name: dns-tester             # 컨테이너 이름
    # DNS 테스트 명령어들:
    # nslookup = DNS 이름을 IP 주소로 변환
    # 서비스 이름(db, redis, app)으로 다른 컨테이너를 찾을 수 있어!
    command: >
      sh -c "
        echo '=== Docker DNS 테스트 ===' &&
        echo '--- db 서비스 DNS 조회 ---' &&
        nslookup db 2>/dev/null || echo 'db 찾을 수 없음' &&
        echo '--- redis 서비스 DNS 조회 ---' &&
        nslookup redis 2>/dev/null || echo 'redis 찾을 수 없음' &&
        echo '--- app 서비스 DNS 조회 ---' &&
        nslookup app 2>/dev/null || echo 'app 찾을 수 없음' &&
        echo '=== DNS 테스트 완료 ===' &&
        sleep 3600
      "
    depends_on:
      - db
      - redis
    networks:
      - backend                            # backend에서 db, redis 이름 해석 가능

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# volumes: 볼륨 정의
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
volumes:
  # ── 기본 Named Volume ──
  # driver: local = 호스트 디스크에 저장 (기본값)
  nginx-data:
    driver: local                          # Nginx 웹 파일 저장
    name: vol-nginx-data                   # 볼륨 이름 고정

  db-data:
    driver: local                          # PostgreSQL 데이터 저장
    name: vol-db-data                      # 볼륨 이름 고정

  redis-data:
    driver: local                          # Redis 데이터 저장
    name: vol-redis-data

  app-uploads:
    driver: local                          # 업로드 파일 저장
    name: vol-app-uploads

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# networks: 네트워크 정의
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
# 네트워크 드라이버 종류:
# 1. bridge (기본) - 같은 호스트의 컨테이너끼리 통신
# 2. host - 호스트의 네트워크를 직접 사용 (격리 없음)
# 3. overlay - 여러 호스트의 컨테이너끼리 통신 (Docker Swarm)
# 4. none - 네트워크 없음 (완전 격리)
#
networks:
  frontend:
    driver: bridge                         # bridge: 기본 네트워크 드라이버
    name: vol-net-frontend                 # 네트워크 이름 고정
    # ── IPAM: IP 주소 관리 ──
    # IP 대역을 직접 지정할 수 있어
    ipam:
      config:
        - subnet: 172.20.0.0/16            # 이 네트워크의 IP 범위
          gateway: 172.20.0.1              # 게이트웨이 IP

  backend:
    driver: bridge
    name: vol-net-backend
    # internal: true 로 설정하면 외부 인터넷 접근이 차단돼
    # DB 네트워크는 외부 접근이 필요 없으니 보안상 좋아
    # internal: true
    ipam:
      config:
        - subnet: 172.21.0.0/16
          gateway: 172.21.0.1
