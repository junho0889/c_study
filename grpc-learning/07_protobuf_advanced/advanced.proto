// ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
//
//   gRPC 학습 07단계: Protocol Buffers 심화
//   ─ oneof, map, repeated, nested, enum, well-known types ─
//
//   proto 파일은 gRPC의 "약속 종이"이자 "데이터 설계도"입니다.
//   여기서는 더 다양한 데이터 구조를 표현하는 방법을 배웁니다.
//
// ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■

syntax = "proto3";

package lesson.advanced;

// ─────────────────────────────────────────────────────────────
// Well-Known Types (구글이 미리 만들어 둔 자주 쓰는 타입)
// import로 가져와서 사용합니다.
// ─────────────────────────────────────────────────────────────
import "google/protobuf/timestamp.proto";  // 날짜/시간
import "google/protobuf/duration.proto";   // 시간 간격
import "google/protobuf/any.proto";        // 아무 타입이나 담기
import "google/protobuf/wrappers.proto";   // nullable 값


// ┌─────────────────────────────────────────────────────────────┐
// │  Enum (열거형) - 정해진 값 중에서만 고르기                   │
// │                                                             │
// │  비유: 신호등의 색이 빨강/노랑/초록만 있는 것처럼,           │
// │  학년도 1/2/3만 있을 수 있습니다.                            │
// │  0번이 반드시 있어야 하고, 이것이 기본값이 됩니다.           │
// └─────────────────────────────────────────────────────────────┘
enum Grade {
    GRADE_UNSPECIFIED = 0;  // proto3 규칙: 0번은 "정해지지 않음"
    GRADE_FIRST = 1;        // 1학년
    GRADE_SECOND = 2;       // 2학년
    GRADE_THIRD = 3;        // 3학년
}

// 동아리 종류
enum Club {
    CLUB_UNSPECIFIED = 0;
    CLUB_SOCCER = 1;        // 축구부
    CLUB_ART = 2;           // 미술부
    CLUB_SCIENCE = 3;       // 과학부
    CLUB_MUSIC = 4;         // 음악부
}


// ┌─────────────────────────────────────────────────────────────┐
// │  기본 메시지 + repeated (배열/리스트)                        │
// │                                                             │
// │  repeated = "이 필드가 0개 이상 여러 개 올 수 있다"          │
// │  비유: 장바구니에 물건을 여러 개 담을 수 있는 것!            │
// └─────────────────────────────────────────────────────────────┘
message Student {
    int32 id = 1;                    // 학번
    string name = 2;                 // 이름
    Grade grade = 3;                 // 학년 (enum 사용)
    repeated string hobbies = 4;     // 취미 목록 (여러 개 가능!)
    // hobbies: ["축구", "그림", "게임"] 이렇게 여러 개!
    repeated int32 scores = 5;       // 과목별 점수 목록
}


// ┌─────────────────────────────────────────────────────────────┐
// │  Nested Message (메시지 안의 메시지)                         │
// │                                                             │
// │  비유: 편지봉투(ClassRoom) 안에 편지(Student)가 들어 있고,  │
// │  편지 안에 사진(Address)이 들어 있는 것!                     │
// └─────────────────────────────────────────────────────────────┘
message Address {
    string city = 1;       // 시/도
    string district = 2;   // 구/군
    string detail = 3;     // 상세 주소
}

message Teacher {
    int32 id = 1;
    string name = 2;
    Address home_address = 3;        // 중첩된 메시지! (Address를 필드로)
    Address school_address = 4;      // 같은 메시지 타입을 여러 번 사용 가능
}

message ClassRoom {
    int32 room_number = 1;
    Teacher homeroom_teacher = 2;    // 담임 선생님 (중첩)
    repeated Student students = 3;   // 학생 목록 (중첩 + 반복)
}


// ┌─────────────────────────────────────────────────────────────┐
// │  Map (딕셔너리/사전)                                        │
// │                                                             │
// │  map = "키-값 쌍"으로 데이터를 저장                          │
// │  비유: 사물함 번호(키) → 학생 이름(값)                       │
// │                                                             │
// │  주의: map의 키는 정수 또는 문자열만 가능!                   │
// │  (float, bytes, enum, message는 키가 될 수 없습니다)        │
// └─────────────────────────────────────────────────────────────┘
message ScoreBoard {
    // 과목명(string) → 점수(int32)
    // 예: {"수학": 95, "영어": 88, "과학": 92}
    map<string, int32> subject_scores = 1;

    // 학생ID(int32) → 학생 정보(Student)
    // map의 값은 메시지 타입도 가능!
    map<int32, Student> student_map = 2;
}


// ┌─────────────────────────────────────────────────────────────┐
// │  Oneof (여러 필드 중 하나만 선택)                            │
// │                                                             │
// │  비유: 주문할 때 "음료 또는 디저트 중 하나만 선택하세요"     │
// │  둘 다 동시에 값이 있을 수 없습니다!                         │
// │                                                             │
// │  활용: 여러 타입의 응답을 하나의 메시지로 표현할 때           │
// └─────────────────────────────────────────────────────────────┘
message NotificationMessage {
    string title = 1;

    // 알림 내용: 텍스트, 이미지, 점수 알림 중 하나만!
    oneof content {
        string text_message = 2;       // 텍스트 알림
        bytes image_data = 3;          // 이미지 알림 (바이너리)
        ScoreAlert score_alert = 4;    // 점수 알림 (메시지 타입)
    }
}

message ScoreAlert {
    string student_name = 1;
    string subject = 2;
    int32 old_score = 3;
    int32 new_score = 4;
}


// ┌─────────────────────────────────────────────────────────────┐
// │  Well-Known Types 사용 예시                                 │
// │                                                             │
// │  google.protobuf.Timestamp → 날짜와 시간                    │
// │  google.protobuf.Duration  → 시간 간격                      │
// │  google.protobuf.Any       → 어떤 메시지든 담을 수 있음      │
// │  google.protobuf.StringValue → null 가능한 문자열            │
// │                                                             │
// │  비유:                                                      │
// │  Timestamp = 달력의 특정 날짜 (2026년 3월 21일 오전 10시)    │
// │  Duration = 타이머 (2시간 30분)                              │
// │  Any = 아무거나 넣을 수 있는 만능 상자                       │
// └─────────────────────────────────────────────────────────────┘
message Exam {
    int32 id = 1;
    string name = 2;

    // Timestamp: 시험 시작 시간
    google.protobuf.Timestamp start_time = 3;

    // Duration: 시험 시간 (90분 등)
    google.protobuf.Duration duration = 4;

    // StringValue: null이 가능한 메모
    // proto3에서 string은 기본값이 "" (빈 문자열)이라
    // "값이 없음"과 "빈 문자열"을 구분할 수 없습니다.
    // StringValue를 쓰면 null을 표현할 수 있습니다!
    google.protobuf.StringValue memo = 5;

    // Any: 어떤 추가 데이터든 담을 수 있음
    google.protobuf.Any extra_info = 6;
}


// ┌─────────────────────────────────────────────────────────────┐
// │  서비스 정의                                                │
// └─────────────────────────────────────────────────────────────┘
service StudentService {
    // 학생 조회
    rpc GetStudent(GetStudentRequest) returns (Student);

    // 학생 목록 조회 (서버 스트리밍)
    rpc ListStudents(ListStudentsRequest) returns (stream Student);

    // 성적표 조회
    rpc GetScoreBoard(GetScoreBoardRequest) returns (ScoreBoard);

    // 알림 보내기
    rpc SendNotification(NotificationMessage) returns (NotificationResponse);
}

message GetStudentRequest {
    int32 id = 1;
}

message ListStudentsRequest {
    Grade grade_filter = 1;         // 특정 학년만 필터
    Club club_filter = 2;           // 특정 동아리만 필터
    int32 page_size = 3;            // 페이지 크기
}

message GetScoreBoardRequest {
    int32 class_room_number = 1;
}

message NotificationResponse {
    bool success = 1;
    string message = 2;
}


// ─────────────────────────────────────────────────────────────
// proto3 vs proto2 차이점 (참고)
// ─────────────────────────────────────────────────────────────
//
// proto3 (현재 표준, 이 파일에서 사용):
//   - 모든 필드가 optional (기본값이 자동 적용)
//   - 기본값: 숫자=0, 문자열="", bool=false
//   - required 키워드 없음
//   - enum 0번 필수
//
// proto2 (옛날 버전):
//   - required, optional 키워드 사용
//   - 기본값을 직접 지정 가능
//   - required 필드 누락 시 에러
//
// 결론: 새 프로젝트는 proto3를 사용하세요!
// ─────────────────────────────────────────────────────────────
