##############################################################################
# ■■■ Redis Sentinel 설정 파일 ■■■
#
# Sentinel은 Redis 마스터/레플리카를 감시하고,
# 마스터 장애 시 자동으로 페일오버를 수행합니다.
#
# 주의: Sentinel은 이 설정 파일을 런타임에 수정합니다.
#       따라서 docker-compose에서는 복사본을 사용합니다.
##############################################################################

# ■■■ Sentinel 기본 설정 ■■■

# Sentinel이 리스닝할 포트
port 26379

# Sentinel 작업 디렉토리
dir /tmp

# ■■■ 마스터 모니터링 설정 ■■■

# sentinel monitor <마스터이름> <마스터IP> <마스터포트> <쿼럼>
# 마스터이름: 이 Sentinel이 감시하는 마스터의 논리적 이름
# 쿼럼: ODOWN(객관적 다운) 판단에 필요한 최소 Sentinel 동의 수
#       3대 Sentinel에서 쿼럼=2 → 2대 이상이 마스터 다운에 동의해야 페일오버
sentinel monitor mymaster redis-master 6379 2

# ■■■ 인증 설정 ■■■

# sentinel auth-pass: 마스터/레플리카에 연결할 때 사용할 비밀번호
# redis.conf의 requirepass와 동일하게 설정
sentinel auth-pass mymaster redis1234

# ■■■ 타이밍 설정 ■■■

# sentinel down-after-milliseconds: SDOWN(주관적 다운) 판단 시간 (밀리초)
# 이 시간 동안 마스터가 응답하지 않으면 해당 Sentinel이 "다운"으로 판단
# 5000 = 5초 (프로덕션에서는 30000=30초 권장 - 네트워크 지연 고려)
sentinel down-after-milliseconds mymaster 5000

# sentinel failover-timeout: 페일오버 타임아웃 (밀리초)
# 페일오버 전체 과정의 최대 시간
# 이 시간 내에 완료되지 않으면 페일오버 실패 처리
# 60000 = 60초
sentinel failover-timeout mymaster 60000

# sentinel parallel-syncs: 페일오버 후 동시에 새 마스터와 동기화할 레플리카 수
# 1: 한 번에 1대씩 동기화 (서비스 영향 최소화, 프로덕션 권장)
# 높은 값: 빠른 동기화, 그러나 동기화 중 읽기 불가능
sentinel parallel-syncs mymaster 1

# ■■■ 알림 설정 ■■■

# sentinel notification-script: 이벤트 발생 시 실행할 스크립트
# WARNING 레벨 이벤트 발생 시 호출됨
# 스크립트에 이벤트 타입과 설명이 인자로 전달됨
# sentinel notification-script mymaster /var/redis/notify.sh

# sentinel client-reconfig-script: 페일오버 완료 후 실행할 스크립트
# 새 마스터 정보를 인자로 받아 클라이언트 설정 업데이트 등에 활용
# sentinel client-reconfig-script mymaster /var/redis/reconfig.sh

# ■■■ 보안 설정 ■■■

# Sentinel 자체에는 비밀번호를 설정하지 않음 (실습 환경)
# 프로덕션에서는 sentinel 자체에도 requirepass 설정 권장
# requirepass sentinel-password

# deny-scripts-reconfig: 스크립트 경로 변경 차단
# yes로 설정하면 런타임에 notification-script, client-reconfig-script 변경 불가
sentinel deny-scripts-reconfig yes
