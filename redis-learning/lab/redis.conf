##############################################################################
# ■■■ Redis 마스터 설정 파일 ■■■
#
# 이 파일은 Redis 마스터 노드의 설정을 정의합니다.
# docker-compose.yml에서 마운트하여 사용합니다.
#
# 설정 변경 후 Redis 재시작 필요:
#   docker-compose restart redis-master
#
# 런타임 변경 (재시작 불필요):
#   redis-cli CONFIG SET <설정명> <값>
##############################################################################

# ■■■ 네트워크 설정 ■■■

# bind: Redis가 리스닝할 네트워크 인터페이스
# 0.0.0.0: 모든 인터페이스에서 접속 허용 (Docker 환경에서 필수)
# 프로덕션에서는 특정 IP만 바인딩 권장 (보안)
bind 0.0.0.0

# port: Redis 서버 포트 (기본값: 6379)
port 6379

# protected-mode: bind가 설정되지 않았을 때 외부 접속 차단
# Docker 환경에서는 no로 설정 (네트워크 격리가 이미 적용)
protected-mode no

# tcp-backlog: TCP 연결 대기열 크기
# 동시 접속이 많은 환경에서는 높게 설정
tcp-backlog 511

# timeout: 클라이언트 유휴 시간 초과 (초), 0은 비활성화
# 프로덕션에서는 300 (5분) 권장 - 좀비 연결 방지
timeout 0

# tcp-keepalive: TCP keepalive 패킷 전송 간격 (초)
# 네트워크 장비의 idle timeout으로 인한 연결 끊김 방지
tcp-keepalive 300

# ■■■ 보안 설정 ■■■

# requirepass: 클라이언트 인증 비밀번호
# 모든 명령 실행 전 AUTH <비밀번호> 필요
# 프로덕션에서는 반드시 강력한 비밀번호 설정!
requirepass redis1234

# ■■■ 메모리 관리 ■■■

# maxmemory: Redis가 사용할 최대 메모리
# 이 값을 초과하면 maxmemory-policy에 따라 키를 제거
# 시스템 메모리의 70-80%를 권장 (나머지는 OS/복제 버퍼용)
maxmemory 256mb

# maxmemory-policy: 메모리 한도 초과 시 키 제거 정책
#
# ┌─────────────────────┬──────────────────────────────────────────┐
# │ 정책                │ 설명                                      │
# ├─────────────────────┼──────────────────────────────────────────┤
# │ noeviction          │ 새 쓰기 거부 (에러 반환)                  │
# │ allkeys-lru         │ 모든 키 중 가장 오래 사용하지 않은 키 제거  │
# │ allkeys-lfu         │ 모든 키 중 가장 적게 사용된 키 제거        │
# │ allkeys-random      │ 모든 키 중 무작위 제거                    │
# │ volatile-lru        │ TTL이 설정된 키 중 LRU 제거              │
# │ volatile-lfu        │ TTL이 설정된 키 중 LFU 제거              │
# │ volatile-random     │ TTL이 설정된 키 중 무작위 제거            │
# │ volatile-ttl        │ TTL이 가장 짧은 키 제거                  │
# └─────────────────────┴──────────────────────────────────────────┘
#
# 캐시 용도: allkeys-lru 또는 allkeys-lfu 권장
# 세션 저장소: volatile-lru 또는 volatile-ttl 권장
maxmemory-policy allkeys-lru

# maxmemory-samples: LRU/LFU 알고리즘의 샘플링 수
# 값이 클수록 정확하지만 CPU 사용 증가 (기본값 5, 최대 10 권장)
maxmemory-samples 5

# ■■■ 영속화 설정 - RDB (스냅샷) ■■■

# save: RDB 스냅샷 생성 조건
# save <초> <변경횟수>
# 아래 설정: 3600초(1시간) 동안 1번 이상 변경 시 스냅샷
#           300초(5분) 동안 100번 이상 변경 시 스냅샷
#           60초(1분) 동안 10000번 이상 변경 시 스냅샷
save 3600 1
save 300 100
save 60 10000

# stop-writes-on-bgsave-error: RDB 저장 실패 시 쓰기 거부 여부
# yes: 디스크 문제를 빠르게 감지 가능 (프로덕션 권장)
stop-writes-on-bgsave-error yes

# rdbcompression: RDB 파일 압축 (LZF 알고리즘)
# CPU를 약간 사용하지만 디스크 공간 절약
rdbcompression yes

# rdbchecksum: RDB 파일 무결성 체크섬 (CRC64)
# 약간의 성능 저하가 있지만 데이터 무결성 보장
rdbchecksum yes

# dbfilename: RDB 파일명
dbfilename dump.rdb

# ■■■ 영속화 설정 - AOF (Append Only File) ■■■

# appendonly: AOF 활성화 여부
# RDB는 주기적 스냅샷이므로 사이에 데이터 손실 가능
# AOF는 모든 쓰기 명령을 로그에 기록하여 데이터 손실 최소화
appendonly yes

# appendfilename: AOF 파일명
appendfilename "appendonly.aof"

# appendfsync: AOF 디스크 동기화 빈도
# always: 매 쓰기마다 fsync (가장 안전, 가장 느림)
# everysec: 1초마다 fsync (안정성과 성능의 균형, 프로덕션 권장)
# no: OS에 맡김 (가장 빠르지만 데이터 손실 가능)
appendfsync everysec

# no-appendfsync-on-rewrite: AOF/RDB 재작성 중 fsync 중단 여부
# yes: 재작성 중 I/O 성능 향상, 일시적 데이터 손실 위험
no-appendfsync-on-rewrite no

# AOF 자동 재작성 조건
# 이전 AOF 크기 대비 100% 증가 시 재작성
auto-aof-rewrite-percentage 100
# 최소 64MB 이상일 때만 재작성 (작은 파일은 비효율)
auto-aof-rewrite-min-size 64mb

# ■■■ 로깅 설정 ■■■

# loglevel: 로그 레벨 (debug, verbose, notice, warning)
# notice: 프로덕션 권장 (중요 이벤트만 기록)
loglevel notice

# logfile: 로그 파일 경로 (빈 문자열이면 stdout)
# Docker 환경에서는 stdout 권장 (docker logs로 확인)
logfile ""

# ■■■ 슬로우 로그 설정 ■■■

# slowlog-log-slower-than: 이 시간(마이크로초)보다 느린 명령을 기록
# 10000 = 10ms (프로덕션에서 성능 모니터링에 필수)
slowlog-log-slower-than 10000

# slowlog-max-len: 슬로우 로그 최대 보관 수
slowlog-max-len 128

# ■■■ 클라이언트 설정 ■■■

# maxclients: 최대 동시 접속 클라이언트 수
# 기본값 10000, 프로덕션에서는 서비스 규모에 맞게 조정
maxclients 10000

# ■■■ 위험 명령어 비활성화 ■■■
# 프로덕션에서는 위험한 명령을 비활성화하거나 이름 변경 권장
# rename-command FLUSHDB ""      # FLUSHDB 비활성화
# rename-command FLUSHALL ""     # FLUSHALL 비활성화
# rename-command KEYS ""         # KEYS 비활성화 (SCAN 사용 권장)
# rename-command CONFIG ""       # CONFIG 비활성화
