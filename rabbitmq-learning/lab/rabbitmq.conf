##############################################################################
# ■■■ RabbitMQ 서버 설정 파일 ■■■
#
# 이 파일은 RabbitMQ 서버의 주요 설정을 정의합니다.
# docker-compose.yml에서 /etc/rabbitmq/rabbitmq.conf 로 마운트됩니다.
#
# 설정 형식: key = value (RabbitMQ 3.7+ New Style Config)
# 공식 문서: https://www.rabbitmq.com/configure.html
##############################################################################

# ■■■ 리스너 설정 ■■■

# AMQP 프로토콜 리스너 포트 (기본값: 5672)
# 프로듀서/컨슈머가 이 포트로 연결
listeners.tcp.default = 5672

# Management UI HTTP 리스너 포트 (기본값: 15672)
management.tcp.port = 15672

# Management UI에서 사전 정의 파일(definitions.json) 로드
# RabbitMQ 시작 시 Exchange, Queue, Binding을 자동으로 생성
management.load_definitions = /etc/rabbitmq/definitions.json

# ■■■ 메모리 관리 ■■■

# vm_memory_high_watermark: 메모리 워터마크 (시스템 메모리 대비 비율)
# 이 비율을 초과하면 모든 연결의 Publisher를 블로킹 (flow control)
# 기본값: 0.4 (시스템 메모리의 40%)
# 실습 환경에서는 낮게 설정, 프로덕션에서는 0.4~0.6 권장
vm_memory_high_watermark.relative = 0.4

# 페이징 비율: 워터마크의 50%에 도달하면 메시지를 디스크로 페이징
# 메모리 부족을 미리 방지
vm_memory_high_watermark_paging_ratio = 0.5

# ■■■ 디스크 관리 ■■■

# disk_free_limit: 최소 여유 디스크 공간
# 여유 공간이 이 값 미만이면 모든 Publisher 블로킹
# 프로덕션에서는 최소 2GB 이상 권장
disk_free_limit.absolute = 500MB

# ■■■ 연결 설정 ■■■

# 채널 최대 수 (연결 당)
# 0 = 무제한, 프로덕션에서는 적절한 제한 설정 권장
channel_max = 128

# 하트비트 간격 (초)
# 클라이언트와 서버 간 연결 활성 상태 확인
# 0 = 비활성화, 프로덕션에서는 60초 권장
heartbeat = 60

# 프레임 최대 크기 (바이트)
# 큰 메시지를 처리해야 하면 값을 늘림
# 0 = 무제한, 기본값: 131072 (128KB)
frame_max = 131072

# ■■■ 큐 설정 ■■■

# 큐 메시지 기본 TTL (밀리초, 선택사항)
# 설정하면 이 시간이 지난 메시지는 자동 삭제
# 큐 레벨에서 개별 설정 가능하므로 여기서는 주석 처리
# queue.default.ttl = 3600000

# ■■■ 로깅 설정 ■■■

# 로그 레벨: debug, info, warning, error, critical, none
# 콘솔 로그 (Docker 환경에서 docker logs로 확인)
log.console = true
log.console.level = info

# 파일 로그 (선택사항, Docker 환경에서는 콘솔 로그 권장)
# log.file = /var/log/rabbitmq/rabbit.log
# log.file.level = info

# 연결 로그: 클라이언트 연결/해제 이벤트 기록
log.connection.level = info

# 채널 로그: 채널 열기/닫기 이벤트 기록
log.channel.level = warning

# ■■■ 클러스터 설정 ■■■

# 클러스터 형성 방식 (단독 실행 시 classic_config)
# cluster_formation.peer_discovery_backend = classic_config

# 클러스터 노드 이름 형식
# longname: FQDN 사용 (다른 호스트 간 클러스터링)
# shortname: 호스트명만 사용 (같은 호스트 내)
# cluster_formation.node_type = disc

# ■■■ 보안 설정 ■■■

# 기본 사용자에게 관리자 태그 부여
# tags: management, policymaker, monitoring, administrator
default_user_tags.administrator = true

# 게스트 사용자의 로컬 전용 접근 (보안)
# true: localhost에서만 guest 계정 사용 가능
# Docker 환경에서는 false로 설정 (Docker 내부는 localhost가 아님)
loopback_users.guest = true

# ■■■ 프리페치 설정 ■■■

# consumer_timeout: 컨슈머가 이 시간(밀리초) 내에 ACK하지 않으면 재전달
# 기본값: 1800000 (30분)
# 처리 시간이 긴 작업은 이 값을 늘려야 함
consumer_timeout = 1800000

# ■■■ 통계 수집 설정 ■■■

# Management 플러그인의 통계 수집 간격 (밀리초)
# 짧을수록 실시간에 가깝지만 CPU 사용 증가
collect_statistics_interval = 5000

# 통계 수집 대상 (coarse: 기본, fine: 상세, none: 비활성화)
# fine: 메시지별 상세 통계 (CPU 부하 높음)
management.rates_mode = basic
